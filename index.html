<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — Speakeasy Cocktail Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100c09; --bg-panel: #1a1410; --bg-card: #221a14; --bg-card-hover: #2b2119;
    --border: #3a2c1e; --border-light: #4d3b28; --gold: #c9a24a; --gold-bright: #e0bd6a;
    --gold-dim: #8a7040; --red: #7a2222; --red-bright: #a5322f;
    --text: #e8ddc9; --text-dim: #a9997d; --text-faint: #6f6350;
    --font-head: 'Cinzel', serif; --font-body: 'EB Garamond', Georgia, serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3ede0; --bg-panel: #ffffff; --bg-card: #fbf7ee; --bg-card-hover: #f4ecd8;
      --border: #d8c9a8; --border-light: #c4b28a; --gold: #96741f; --gold-bright: #7a5c14;
      --gold-dim: #a98d4a; --red: #7a2222; --red-bright: #a5322f;
      --text: #2a2013; --text-dim: #5a4c34; --text-faint: #8a7a5c;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3ede0; --bg-panel: #ffffff; --bg-card: #fbf7ee; --bg-card-hover: #f4ecd8;
    --border: #d8c9a8; --border-light: #c4b28a; --gold: #96741f; --gold-bright: #7a5c14;
    --gold-dim: #a98d4a; --red: #7a2222; --red-bright: #a5322f;
    --text: #2a2013; --text-dim: #5a4c34; --text-faint: #8a7a5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    background-image: radial-gradient(ellipse at top, rgba(201,162,74,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    color: var(--text); font-family: var(--font-body); font-size: 17px; line-height: 1.5; min-height: 100vh;
  }
  header { padding: 28px 20px 18px; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(201,162,74,0.05), transparent); }
  header h1 { font-family: var(--font-head); font-weight: 700; letter-spacing: 0.06em; font-size: clamp(24px, 5vw, 34px); margin: 0 0 4px; color: var(--gold-bright); text-shadow: 0 0 20px rgba(201,162,74,0.25); }
  header .sub { color: var(--text-dim); font-style: italic; font-size: 15px; }
  .divider { width: 120px; height: 1px; margin: 10px auto 0; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); }
  .toolbar { max-width: 900px; margin: 18px auto 0; padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="password"], select, textarea, input[type="number"] {
    background: var(--bg-panel); border: 1px solid var(--border-light); color: var(--text);
    font-family: var(--font-body); font-size: 16px; padding: 9px 12px; border-radius: 4px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  #searchInput { flex: 1; min-width: 160px; }
  #categoryFilter { min-width: 150px; }
  button {
    font-family: var(--font-head); background: transparent; border: 1px solid var(--gold-dim);
    color: var(--gold-bright); padding: 9px 16px; border-radius: 4px; cursor: pointer;
    font-size: 13px; letter-spacing: 0.04em; transition: background 0.15s, color 0.15s; white-space: nowrap;
  }
  button:hover { background: rgba(201,162,74,0.12); }
  button.primary { background: var(--gold-dim); color: #14100b; border-color: var(--gold-dim); font-weight: 600; }
  button.primary:hover { background: var(--gold); }
  button.danger { border-color: var(--red-bright); color: var(--red-bright); }
  button.danger:hover { background: rgba(165,50,47,0.15); }
  button.ghost { border-color: transparent; color: var(--text-dim); padding: 6px 10px; }
  button.ghost:hover { color: var(--gold-bright); background: rgba(201,162,74,0.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { max-width: 900px; margin: 20px auto 60px; padding: 0 16px; }
  .category-group { margin-bottom: 28px; }
  .category-title { font-family: var(--font-head); font-size: 15px; letter-spacing: 0.08em; color: var(--gold); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .category-count { color: var(--text-faint); font-size: 12px; letter-spacing: 0; text-transform: none; font-family: var(--font-body); font-style: italic; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .card:hover { background: var(--bg-card-hover); border-color: var(--border-light); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-family: var(--font-head); font-size: 18px; color: var(--text); }
  .status-pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; letter-spacing: 0.03em; border: 1px solid; }
  .status-finalized { color: #7fc97f; border-color: #3d5c3d; background: rgba(127,201,127,0.08); }
  .status-named { color: var(--gold-bright); border-color: var(--gold-dim); background: rgba(201,162,74,0.08); }
  .status-draft { color: var(--text-dim); border-color: var(--border-light); background: rgba(255,255,255,0.03); }
  .status-placeholder { color: var(--text-faint); border-color: var(--border); background: transparent; font-style: italic; }
  .card-spirit { color: var(--text-dim); font-size: 14px; font-style: italic; margin-top: 2px; }
  .card-rating { margin-top: 6px; font-size: 14px; color: var(--gold); }
  .empty-state { text-align: center; color: var(--text-faint); font-style: italic; padding: 40px 20px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 100; }
  .modal { background: var(--bg-panel); border: 1px solid var(--border-light); border-radius: 8px; max-width: 640px; width: 100%; padding: 26px 24px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal h2 { font-family: var(--font-head); color: var(--gold-bright); margin: 0 0 4px; font-size: 22px; }
  .modal-close-row { display: flex; justify-content: flex-end; margin-bottom: -10px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; letter-spacing: 0.05em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { resize: vertical; font-size: 16px; }
  .field .hint { font-size: 12px; color: var(--text-faint); margin-top: 4px; font-style: italic; }
  .ingredient-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .ingredient-row input { flex: 1; }
  #ingredientsList { margin-bottom: 6px; }
  .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .modal-actions .left { display: flex; gap: 8px; }
  .detail-section { margin-bottom: 16px; }
  .detail-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 4px; }
  .detail-value { color: var(--text); white-space: pre-wrap; }
  .detail-ingredients { list-style: none; padding: 0; margin: 0; }
  .detail-ingredients li { padding: 3px 0; border-bottom: 1px dotted var(--border); }
  .detail-ingredients li:last-child { border-bottom: none; }
  .tasting-entry { border-left: 2px solid var(--gold-dim); padding: 6px 0 6px 12px; margin-bottom: 8px; }
  .tasting-entry .meta { font-size: 12px; color: var(--text-faint); }
  .star-row { display: flex; gap: 4px; font-size: 22px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .star { color: var(--border-light); }
  .star.filled { color: var(--gold); }
  .loading-msg { text-align: center; color: var(--text-faint); padding: 50px; font-style: italic; }
  .status-bar { text-align: center; font-size: 12px; padding: 10px 16px 0; font-style: italic; color: var(--text-faint); }
  .status-bar.error { color: var(--red-bright); }
  .status-bar.ok { color: var(--gold); }
  .error-box { background: rgba(165,50,47,0.1); border: 1px solid var(--red-bright); color: var(--red-bright); padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; font-size: 14px; }
  @media (max-width: 480px) { .modal { padding: 20px 16px; } }
</style>
</head>

  var cocktails = [];
  var currentFilter = { search: "", category: "", status: "" };
  var settings = null; // { owner, repo, path, token }
  var currentSha = null; // sha of the file on GitHub, needed for updates
  var isSyncing = false;

  var mainEl = document.getElementById("main");
  var modalRoot = document.getElementById("modalRoot");
  var searchInput = document.getElementById("searchInput");
  var categoryFilter = document.getElementById("categoryFilter");
  var statusFilter = document.getElementById("statusFilter");
  var addBtn = document.getElementById("addBtn");
  var syncBtn = document.getElementById("syncBtn");
  var settingsBtn = document.getElementById("settingsBtn");
  var statusBar = document.getElementById("statusBar");

  CATEGORIES.forEach(function(c) {
    var opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    categoryFilter.appendChild(opt);
  });

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function(c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function slugify(name) {
    var base = String(name || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return (base || "cocktail") + "-" + Math.random().toString(36).slice(2, 7);
  }
  function statusLabel(s) {
    var found = STATUS_OPTIONS.filter(function(o){ return o.value === s; })[0];
    return found ? found.label : "Draft";
  }
  function avgRating(entries) {
    if (!entries || !entries.length) return null;
    var withRating = entries.filter(function(e){ return typeof e.rating === "number" && e.rating > 0; });
    if (!withRating.length) return null;
    var sum = withRating.reduce(function(a,e){ return a + e.rating; }, 0);
    return sum / withRating.length;
  }
  function starsHtml(rating) {
    var full = Math.round(rating || 0);
    var out = "";
    for (var i = 1; i <= 5; i++) out += (i <= full) ? "★" : "☆";
    return out;
  }
  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function base64ToUtf8(b64) {
    return decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));
  }
  function setStatus(msg, cls) {
    statusBar.textContent = msg || "";
    statusBar.className = "status-bar" + (cls ? " " + cls : "");
  }

  // ---------- Settings ----------

  function loadSettings() {
    try {
      var raw = window.localStorage.getItem(SETTINGS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error("settings load failed", e); }
    return null;
  }
  function saveSettings(s) {
    try {
      window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
      return true;
    } catch (e) { console.error("settings save failed", e); return false; }
  }
  function loadLocalCache() {
    try {
      var raw = window.localStorage.getItem(LOCAL_CACHE_KEY);
      if (raw) { var p = JSON.parse(raw); if (p && Array.isArray(p.cocktails)) return p; }
    } catch (e) {}
    return null;
  }
  function saveLocalCache(sha) {
    try {
      window.localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ cocktails: cocktails, sha: sha || currentSha }));
    } catch (e) { console.error("local cache save failed", e); }
  }

  function githubUrl() {
    return "https://api.github.com/repos/" + encodeURIComponent(settings.owner) + "/" + encodeURIComponent(settings.repo) + "/contents/" + settings.path.split("/").map(encodeURIComponent).join("/");
  }
  function githubHeaders() {
    return {
      "Authorization": "Bearer " + settings.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }

  // ---------- GitHub sync ----------

  function fetchFromGitHub() {
    if (!settings) return Promise.resolve(false);
    setStatus("Syncing with GitHub…");
    isSyncing = true;
    return fetch(githubUrl(), { headers: githubHeaders() }).then(function(resp) {
      if (resp.status === 404) {
        // File doesn't exist yet — create it with seed data
        return createInitialFile();
      }
      if (!resp.ok) {
        return resp.json().catch(function(){ return {}; }).then(function(body) {
          throw new Error("GitHub error " + resp.status + (body && body.message ? ": " + body.message : ""));
        });
      }
      return resp.json().then(function(body) {
        currentSha = body.sha;
        var decoded = base64ToUtf8(body.content);
        var parsed = JSON.parse(decoded);
        if (!Array.isArray(parsed)) throw new Error("Data file didn't contain a valid list");
        cocktails = parsed;
        saveLocalCache(currentSha);
        setStatus("Synced with GitHub just now.", "ok");
        return true;
      });
    }).catch(function(err) {
      console.error("fetch from GitHub failed", err);
      var cached = loadLocalCache();
      if (cached) {
        cocktails = cached.cocktails;
        currentSha = cached.sha;
        setStatus("Couldn't reach GitHub (" + err.message + ") — showing last saved copy from this device.", "error");
      } else {
        setStatus("Couldn't reach GitHub (" + err.message + ") and no local copy exists yet.", "error");
        cocktails = [];
      }
      return false;
    }).finally(function() {
      isSyncing = false;
      render();
    });
  }

  function createInitialFile() {
    setStatus("First time setup — creating your data file on GitHub…");
    var content = utf8ToBase64(JSON.stringify(SEED_DATA, null, 2));
    return fetch(githubUrl(), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, githubHeaders()),
      body: JSON.stringify({ message: "Initialize cocktail ledger", content: content })
    }).then(function(resp) {
      if (!resp.ok) {
        return resp.json().catch(function(){ return {}; }).then(function(body) {
          throw new Error("Couldn't create file: " + resp.status + (body && body.message ? " " + body.message : ""));
        });
      }
      return resp.json();
    }).then(function(body) {
      currentSha = body.content.sha;
      cocktails = SEED_DATA.slice();
      saveLocalCache(currentSha);
      setStatus("Created your data file on GitHub with starting recipes.", "ok");
      return true;
    });
  }

  function pushToGitHub(retrying) {
    if (!settings) {
      setStatus("Not connected to GitHub — changes are only saved on this device.", "error");
      saveLocalCache(null);
      return Promise.resolve(false);
    }
    setStatus("Saving to GitHub…");
    var content = utf8ToBase64(JSON.stringify(cocktails, null, 2));
    var payload = { message: "Update cocktail ledger", content: content };
    if (currentSha) payload.sha = currentSha;
    return fetch(githubUrl(), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, githubHeaders()),
      body: JSON.stringify(payload)
    }).then(function(resp) {
      if (resp.status === 409 && !retrying) {
        // sha conflict — someone else wrote in between. Refetch sha and retry once.
        return fetch(githubUrl(), { headers: githubHeaders() }).then(function(r2) {
          return r2.json();
        }).then(function(body2) {
          currentSha = body2.sha;
          return pushToGitHub(true);
        });
      }
      if (!resp.ok) {
        return resp.json().catch(function(){ return {}; }).then(function(body) {
          throw new Error("GitHub error " + resp.status + (body && body.message ? ": " + body.message : ""));
        });
      }
      return resp.json().then(function(body) {
        currentSha = body.content.sha;
        saveLocalCache(currentSha);
        setStatus("Saved to GitHub.", "ok");
        return true;
      });
    }).catch(function(err) {
      console.error("push to GitHub failed", err);
      saveLocalCache(currentSha);
      setStatus("Couldn't save to GitHub (" + err.message + ") — kept on this device only for now. Try Refresh later.", "error");
      return false;
    });
  }

  // ---------- Rendering ----------

  function render() {
    if (isSyncing) {
      mainEl.innerHTML = '<div class="loading-msg">Uncorking the ledger…</div>';
      return;
    }
    var filtered = cocktails.filter(function(c) {
      if (currentFilter.category && c.category !== currentFilter.category) return false;
      if (currentFilter.status && c.status !== currentFilter.status) return false;
      if (currentFilter.search) {
        var q = currentFilter.search.toLowerCase();
        var hay = [c.name || "", (c.ingredients || []).join(" "), c.spirit || "", c.notes || ""].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (!cocktails.length) {
      mainEl.innerHTML = '<div class="empty-state">No cocktails yet. Add your first one to start the ledger.</div>';
      return;
    }
    if (!filtered.length) {
      mainEl.innerHTML = '<div class="empty-state">Nothing matches — try a different search or filter.</div>';
      return;
    }

    var byCategory = {};
    filtered.forEach(function(c) {
      var cat = c.category || "Uncategorized";
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(c);
    });
    var order = CATEGORIES.concat(Object.keys(byCategory).filter(function(c){ return CATEGORIES.indexOf(c) === -1; }));

    var html = "";
    order.forEach(function(cat) {
      var items = byCategory[cat];
      if (!items || !items.length) return;
      html += '<div class="category-group">';
      html += '<div class="category-title"><span>' + escapeHtml(cat) + '</span><span class="category-count">' + items.length + '</span></div>';
      items.forEach(function(c) {
        var rating = avgRating(c.tastingEntries);
        html += '<div class="card" data-id="' + escapeHtml(c.id) + '">';
        html += '<div class="card-top">';
        html += '<div class="card-name">' + escapeHtml(c.name || "Untitled") + '</div>';
        html += '<div class="status-pill status-' + escapeHtml(c.status || "draft") + '">' + escapeHtml(statusLabel(c.status)) + '</div>';
        html += '</div>';
        if (c.spirit) html += '<div class="card-spirit">' + escapeHtml(c.spirit) + '</div>';
        if (rating !== null) html += '<div class="card-rating">' + starsHtml(rating) + ' <span style="color:var(--text-faint);font-size:12px;">(' + rating.toFixed(1) + ')</span></div>';
        html += '</div>';
      });
      html += '</div>';
    });
    mainEl.innerHTML = html;

    Array.prototype.forEach.call(mainEl.querySelectorAll(".card"), function(el) {
      el.addEventListener("click", function() {
        var id = el.getAttribute("data-id");
        var c = cocktails.filter(function(x){ return x.id === id; })[0];
        if (c) openDetailModal(c);
      });
    });
  }

  // ---------- Modals: detail / edit ----------

  function closeModal() { modalRoot.innerHTML = ""; }

  function openDetailModal(c) {
    var rating = avgRating(c.tastingEntries);
    var ingredientsHtml = (c.ingredients || []).map(function(i) { return "<li>" + escapeHtml(i) + "</li>"; }).join("");
    var tastingHtml = (c.tastingEntries || []).slice().reverse().map(function(t) {
      var stars = t.rating ? starsHtml(t.rating) : "";
      var dateStr = t.date ? new Date(t.date).toLocaleDateString() : "";
      return '<div class="tasting-entry"><div class="meta">' + escapeHtml(dateStr) + (stars ? ' · ' + stars : '') + '</div><div>' + escapeHtml(t.note || "") + '</div></div>';
    }).join("");

    var html = '' +
      '<div class="modal-overlay" id="overlay">' +
        '<div class="modal">' +
          '<div class="modal-close-row"><button class="ghost" id="closeBtn">✕ Close</button></div>' +
          '<h2>' + escapeHtml(c.name || "Untitled") + '</h2>' +
          '<div style="color:var(--text-dim);font-style:italic;margin-bottom:14px;">' + escapeHtml(c.category || "") + ' · ' + escapeHtml(statusLabel(c.status)) + '</div>' +
          (c.spirit ? '<div class="detail-section"><div class="detail-label">Spirit</div><div class="detail-value">' + escapeHtml(c.spirit) + '</div></div>' : '') +
          '<div class="detail-section"><div class="detail-label">Ingredients</div><ul class="detail-ingredients">' + (ingredientsHtml || '<li style="color:var(--text-faint);">None listed</li>') + '</ul></div>' +
          (c.method ? '<div class="detail-section"><div class="detail-label">Method</div><div class="detail-value">' + escapeHtml(c.method) + '</div></div>' : '') +
          (c.notes ? '<div class="detail-section"><div class="detail-label">Notes</div><div class="detail-value">' + escapeHtml(c.notes) + '</div></div>' : '') +
          (c.nameStory ? '<div class="detail-section"><div class="detail-label">Name Story</div><div class="detail-value">' + escapeHtml(c.nameStory) + '</div></div>' : '') +
          (c.source ? '<div class="detail-section"><div class="detail-label">Source</div><div class="detail-value">' + escapeHtml(c.source) + '</div></div>' : '') +
          '<div class="detail-section">' +
            '<div class="detail-label">Taste Test Notes' + (rating !== null ? ' — avg ' + starsHtml(rating) + ' (' + rating.toFixed(1) + ')' : '') + '</div>' +
            '<div id="tastingList">' + (tastingHtml || '<div style="color:var(--text-faint);font-style:italic;">No notes yet.</div>') + '</div>' +
            '<div style="margin-top:10px;">' +
              '<div class="star-row" id="newStarRow" data-rating="0">' + [1,2,3,4,5].map(function(i){ return '<span class="star" data-val="' + i + '">☆</span>'; }).join("") + '</div>' +
              '<textarea id="newNoteText" rows="2" placeholder="Add a tasting note…" style="width:100%;"></textarea>' +
              '<button class="primary" id="addNoteBtn" style="margin-top:8px;">Add Note</button>' +
            '</div>' +
          '</div>' +
          '<div class="modal-actions"><div class="left"><button id="editBtn">Edit</button><button class="danger" id="deleteBtn">Delete</button></div></div>' +
        '</div>' +
      '</div>';
    modalRoot.innerHTML = html;

    document.getElementById("closeBtn").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeModal(); });
    document.getElementById("editBtn").addEventListener("click", function() { openEditModal(c); });
    document.getElementById("deleteBtn").addEventListener("click", function() {
      if (confirm('Delete "' + (c.name || "this cocktail") + '" permanently?')) { deleteCocktail(c.id); closeModal(); }
    });
    var starRow = document.getElementById("newStarRow");
    Array.prototype.forEach.call(starRow.querySelectorAll(".star"), function(starEl) {
      starEl.addEventListener("click", function() {
        var val = parseInt(starEl.getAttribute("data-val"), 10);
        starRow.setAttribute("data-rating", String(val));
        Array.prototype.forEach.call(starRow.querySelectorAll(".star"), function(s2) {
          var v2 = parseInt(s2.getAttribute("data-val"), 10);
          s2.textContent = v2 <= val ? "★" : "☆";
          s2.classList.toggle("filled", v2 <= val);
        });
      });
    });
    document.getElementById("addNoteBtn").addEventListener("click", function() {
      var note = document.getElementById("newNoteText").value.trim();
      var rating = parseInt(starRow.getAttribute("data-rating"), 10) || 0;
      if (!note && !rating) return;
      addTastingNote(c.id, note, rating);
      closeModal();
    });
  }

  function openEditModal(existing) {
    var c = existing || {};
    var isNew = !existing;
    var ingredients = (c.ingredients || [""]).slice();
    if (!ingredients.length) ingredients = [""];

    function ingredientsRowsHtml() {
      return ingredients.map(function(val) {
        return '<div class="ingredient-row"><input type="text" class="ingredient-input" value="' + escapeHtml(val) + '" placeholder="e.g. 2 oz bourbon"><button class="ghost removeIngBtn" type="button">✕</button></div>';
      }).join("");
    }
    var catOptionsHtml = CATEGORIES.map(function(cat) {
      return '<option value="' + escapeHtml(cat) + '"' + (c.category === cat ? " selected" : "") + '>' + escapeHtml(cat) + '</option>';
    }).join("");
    var statusOptionsHtml = STATUS_OPTIONS.map(function(o) {
      return '<option value="' + o.value + '"' + (c.status === o.value ? " selected" : "") + '>' + o.label + '</option>';
    }).join("");

    var html = '' +
      '<div class="modal-overlay" id="overlay">' +
        '<div class="modal">' +
          '<div class="modal-close-row"><button class="ghost" id="closeBtn">✕ Close</button></div>' +
          '<h2>' + (isNew ? "Add Cocktail" : "Edit Cocktail") + '</h2>' +
          '<div class="field"><label>Name</label><input type="text" id="f_name" value="' + escapeHtml(c.name || "") + '" placeholder="e.g. The Siren' + "'" + 's Call"></div>' +
          '<div class="field"><label>Category</label><select id="f_category">' + catOptionsHtml + '</select></div>' +
          '<div class="field"><label>Status</label><select id="f_status">' + statusOptionsHtml + '</select></div>' +
          '<div class="field"><label>Spirit / Base</label><input type="text" id="f_spirit" value="' + escapeHtml(c.spirit || "") + '" placeholder="e.g. Bourbon, high-proof"></div>' +
          '<div class="field"><label>Ingredients</label><div id="ingredientsList">' + ingredientsRowsHtml() + '</div><button class="ghost" id="addIngBtn" type="button">+ Add Ingredient</button></div>' +
          '<div class="field"><label>Method</label><textarea id="f_method" rows="3" placeholder="Stir / shake / build instructions…">' + escapeHtml(c.method || "") + '</textarea></div>' +
          '<div class="field"><label>Notes</label><textarea id="f_notes" rows="3" placeholder="Tips, variations, adjustments…">' + escapeHtml(c.notes || "") + '</textarea></div>' +
          '<div class="field"><label>Name Story</label><textarea id="f_nameStory" rows="2" placeholder="Meaning behind the name, who it' + "'" + 's for, etc.">' + escapeHtml(c.nameStory || "") + '</textarea></div>' +
          '<div class="field"><label>Source</label><input type="text" id="f_source" value="' + escapeHtml(c.source || "") + '" placeholder="e.g. Whisky Advocate, personal recipe"></div>' +
          '<div class="modal-actions"><div class="left"></div><button class="primary" id="saveBtn">Save</button></div>' +
        '</div>' +
      '</div>';
    modalRoot.innerHTML = html;

    document.getElementById("closeBtn").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeModal(); });

    function bindIngredientButtons() {
      var list = document.getElementById("ingredientsList");
      Array.prototype.forEach.call(list.querySelectorAll(".removeIngBtn"), function(btn) {
        btn.onclick = function() {
          var row = btn.closest(".ingredient-row");
          if (list.querySelectorAll(".ingredient-row").length > 1) row.remove();
          else row.querySelector(".ingredient-input").value = "";
        };
      });
    }
    bindIngredientButtons();
    document.getElementById("addIngBtn").addEventListener("click", function() {
      var list = document.getElementById("ingredientsList");
      var div = document.createElement("div");
      div.className = "ingredient-row";
      div.innerHTML = '<input type="text" class="ingredient-input" placeholder="e.g. ¼ oz lemon juice"><button class="ghost removeIngBtn" type="button">✕</button>';
      list.appendChild(div);
      bindIngredientButtons();
      div.querySelector("input").focus();
    });

    document.getElementById("saveBtn").addEventListener("click", function() {
      var name = document.getElementById("f_name").value.trim();
      if (!name) { alert("Please give the cocktail a name."); return; }
      var ingredientInputs = document.querySelectorAll("#ingredientsList .ingredient-input");
      var ingredientsOut = Array.prototype.map.call(ingredientInputs, function(inp) { return inp.value.trim(); }).filter(function(v) { return v.length > 0; });
      var data = {
        name: name,
        category: document.getElementById("f_category").value,
        status: document.getElementById("f_status").value,
        spirit: document.getElementById("f_spirit").value.trim(),
        ingredients: ingredientsOut,
        method: document.getElementById("f_method").value.trim(),
        notes: document.getElementById("f_notes").value.trim(),
        nameStory: document.getElementById("f_nameStory").value.trim(),
        source: document.getElementById("f_source").value.trim()
      };
      if (isNew) {
        data.id = slugify(data.name);
        data.tastingEntries = [];
        cocktails.push(data);
      } else {
        data.id = c.id;
        data.tastingEntries = c.tastingEntries || [];
        var idx = cocktails.findIndex(function(x) { return x.id === c.id; });
        if (idx >= 0) cocktails[idx] = data;
      }
      closeModal();
      render();
      pushToGitHub();
    });
  }

  // ---------- Data operations ----------

  function deleteCocktail(id) {
    cocktails = cocktails.filter(function(c) { return c.id !== id; });
    render();
    pushToGitHub();
  }
  function addTastingNote(id, note, rating) {
    var idx = cocktails.findIndex(function(c) { return c.id === id; });
    if (idx < 0) return;
    var entry = { date: new Date().toISOString(), note: note, rating: rating || null };
    if (!cocktails[idx].tastingEntries) cocktails[idx].tastingEntries = [];
    cocktails[idx].tastingEntries.push(entry);
    render();
    pushToGitHub();
  }

  // ---------- GitHub settings modal ----------

  function openSettingsModal(forcedOpen) {
    var s = settings || { owner: "", repo: "", path: "cocktails.json", token: "" };
    var html = '' +
      '<div class="modal-overlay" id="overlay">' +
        '<div class="modal">' +
          (forcedOpen ? '' : '<div class="modal-close-row"><button class="ghost" id="closeBtn">✕ Close</button></div>') +
          '<h2>GitHub Settings</h2>' +
          '<div style="color:var(--text-dim);margin-bottom:14px;">Connect this device to your GitHub repo so your ledger syncs everywhere. This is entered once per device/browser.</div>' +
          '<div class="field"><label>GitHub Username</label><input type="text" id="s_owner" value="' + escapeHtml(s.owner) + '" placeholder="e.g. scottdavis"></div>' +
          '<div class="field"><label>Repository Name</label><input type="text" id="s_repo" value="' + escapeHtml(s.repo) + '" placeholder="e.g. speakeasy-ledger"></div>' +
          '<div class="field"><label>Data File Path</label><input type="text" id="s_path" value="' + escapeHtml(s.path) + '" placeholder="cocktails.json"><div class="hint">Leave as cocktails.json unless you have a reason to change it.</div></div>' +
          '<div class="field"><label>Personal Access Token</label><input type="password" id="s_token" value="' + escapeHtml(s.token) + '" placeholder="ghp_… or github_pat_…"><div class="hint">Needs Contents: Read and write permission on this repo. Stored only in this browser.</div></div>' +
          '<div id="settingsError" class="error-box" style="display:none;"></div>' +
          '<div class="modal-actions"><div class="left"></div><button class="primary" id="saveSettingsBtn">Save &amp; Connect</button></div>' +
        '</div>' +
      '</div>';
    modalRoot.innerHTML = html;
    if (!forcedOpen) {
      document.getElementById("closeBtn").addEventListener("click", closeModal);
      document.getElementById("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeModal(); });
    }
    document.getElementById("saveSettingsBtn").addEventListener("click", function() {
      var owner = document.getElementById("s_owner").value.trim();
      var repo = document.getElementById("s_repo").value.trim();
      var path = document.getElementById("s_path").value.trim() || "cocktails.json";
      var token = document.getElementById("s_token").value.trim();
      var errEl = document.getElementById("settingsError");
      if (!owner || !repo || !token) {
        errEl.textContent = "Username, repository name, and token are all required.";
        errEl.style.display = "block";
        return;
      }
      settings = { owner: owner, repo: repo, path: path, token: token };
      saveSettings(settings);
      closeModal();
      isSyncing = true;
      render();
      fetchFromGitHub();
    });
  }

  // ---------- Init ----------

  searchInput.addEventListener("input", function() { currentFilter.search = searchInput.value; render(); });
  categoryFilter.addEventListener("change", function() { currentFilter.category = categoryFilter.value; render(); });
  statusFilter.addEventListener("change", function() { currentFilter.status = statusFilter.value; render(); });
  addBtn.addEventListener("click", function() { openEditModal(null); });
  syncBtn.addEventListener("click", function() { isSyncing = true; render(); fetchFromGitHub(); });
  settingsBtn.addEventListener("click", function() { openSettingsModal(false); });

  settings = loadSettings();
  if (!settings) {
    var cached = loadLocalCache();
    if (cached) { cocktails = cached.cocktails; currentSha = cached.sha; }
    else { cocktails = SEED_DATA.slice(); }
    render();
    openSettingsModal(true);
  } else {
    isSyncing = true;
    render();
    fetchFromGitHub();
  }
})();
</script>
</body>
</html>
