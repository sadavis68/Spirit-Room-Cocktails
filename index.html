<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — Speakeasy Cocktail Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100c09; --bg-panel: #1a1410; --bg-card: #221a14; --bg-card-hover: #2b2119;
    --border: #3a2c1e; --border-light: #4d3b28; --gold: #c9a24a; --gold-bright: #e0bd6a;
    --gold-dim: #8a7040; --red: #7a2222; --red-bright: #a5322f;
    --text: #e8ddc9; --text-dim: #a9997d; --text-faint: #6f6350;
    --ok: #7fc97f; --warn: #d9a441; --bad: #e07a6e;
    --font-head: 'Cinzel', serif; --font-body: 'EB Garamond', Georgia, serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3ede0; --bg-panel: #ffffff; --bg-card: #fbf7ee; --bg-card-hover: #f4ecd8;
      --border: #d8c9a8; --border-light: #c4b28a; --gold: #96741f; --gold-bright: #7a5c14;
      --gold-dim: #a98d4a; --red: #7a2222; --red-bright: #a5322f;
      --text: #2a2013; --text-dim: #5a4c34; --text-faint: #8a7a5c;
      --ok: #2f6b2f; --warn: #8a6212; --bad: #a5322f;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3ede0; --bg-panel: #ffffff; --bg-card: #fbf7ee; --bg-card-hover: #f4ecd8;
    --border: #d8c9a8; --border-light: #c4b28a; --gold: #96741f; --gold-bright: #7a5c14;
    --gold-dim: #a98d4a; --red: #7a2222; --red-bright: #a5322f;
    --text: #2a2013; --text-dim: #5a4c34; --text-faint: #8a7a5c;
      --ok: #2f6b2f; --warn: #8a6212; --bad: #a5322f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    background-image: radial-gradient(ellipse at top, rgba(201,162,74,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    color: var(--text); font-family: var(--font-body); font-size: 17px; line-height: 1.5; min-height: 100vh;
  }
  header { padding: 28px 20px 18px; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(201,162,74,0.05), transparent); }
  header h1 { font-family: var(--font-head); font-weight: 700; letter-spacing: 0.06em; font-size: clamp(24px, 5vw, 34px); margin: 0 0 4px; color: var(--gold-bright); text-shadow: 0 0 20px rgba(201,162,74,0.25); }
  header .sub { color: var(--text-dim); font-style: italic; font-size: 15px; }
  .divider { width: 120px; height: 1px; margin: 10px auto 0; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); }
  .toolbar { max-width: 900px; margin: 18px auto 0; padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="password"], select, textarea, input[type="number"] {
    background: var(--bg-panel); border: 1px solid var(--border-light); color: var(--text);
    font-family: var(--font-body); font-size: 16px; padding: 9px 12px; border-radius: 4px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  #searchInput { flex: 1; min-width: 160px; }
  #categoryFilter { min-width: 150px; }
  button {
    font-family: var(--font-head); background: transparent; border: 1px solid var(--gold-dim);
    color: var(--gold-bright); padding: 9px 16px; border-radius: 4px; cursor: pointer;
    font-size: 13px; letter-spacing: 0.04em; transition: background 0.15s, color 0.15s; white-space: nowrap;
  }
  button:hover { background: rgba(201,162,74,0.12); }
  button.primary { background: var(--gold-dim); color: #14100b; border-color: var(--gold-dim); font-weight: 600; }
  button.primary:hover { background: var(--gold); }
  button.danger { border-color: var(--red-bright); color: var(--red-bright); }
  button.danger:hover { background: rgba(165,50,47,0.15); }
  button.ghost { border-color: transparent; color: var(--text-dim); padding: 6px 10px; }
  button.ghost:hover { color: var(--gold-bright); background: rgba(201,162,74,0.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { max-width: 900px; margin: 20px auto 60px; padding: 0 16px; }
  .category-group { margin-bottom: 28px; }
  .category-title { font-family: var(--font-head); font-size: 15px; letter-spacing: 0.08em; color: var(--gold); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .category-count { color: var(--text-faint); font-size: 12px; letter-spacing: 0; text-transform: none; font-family: var(--font-body); font-style: italic; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .card:hover { background: var(--bg-card-hover); border-color: var(--border-light); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-family: var(--font-head); font-size: 18px; color: var(--text); }
  .status-pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; letter-spacing: 0.03em; border: 1px solid; }
  .status-finalized { color: #7fc97f; border-color: #3d5c3d; background: rgba(127,201,127,0.08); }
  .status-named { color: var(--gold-bright); border-color: var(--gold-dim); background: rgba(201,162,74,0.08); }
  .status-draft { color: var(--text-dim); border-color: var(--border-light); background: rgba(255,255,255,0.03); }
  .status-placeholder { color: var(--text-faint); border-color: var(--border); background: transparent; font-style: italic; }
  .card-spirit { color: var(--text-dim); font-size: 14px; font-style: italic; margin-top: 2px; }
  .card-ingredients { color: var(--text-faint); font-size: 13px; margin-top: 4px; line-height: 1.4; }
  .card-rating { margin-top: 6px; font-size: 14px; color: var(--gold); }
  .empty-state { text-align: center; color: var(--text-faint); font-style: italic; padding: 40px 20px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 100; }
  .modal { background: var(--bg-panel); border: 1px solid var(--border-light); border-radius: 8px; max-width: 640px; width: 100%; padding: 26px 24px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal h2 { font-family: var(--font-head); color: var(--gold-bright); margin: 0 0 4px; font-size: 22px; }
  .modal-close-row { display: flex; justify-content: flex-end; margin-bottom: -10px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; letter-spacing: 0.05em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { resize: vertical; font-size: 16px; }
  .field .hint { font-size: 12px; color: var(--text-faint); margin-top: 4px; font-style: italic; }
  .ingredient-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .ingredient-row input { flex: 1; }
  #ingredientsList { margin-bottom: 6px; }
  .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .modal-actions .left { display: flex; gap: 8px; }
  .detail-section { margin-bottom: 16px; }
  .detail-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 4px; }
  .detail-value { color: var(--text); white-space: pre-wrap; }
  .detail-ingredients { list-style: none; padding: 0; margin: 0; }
  .detail-ingredients li { padding: 3px 0; border-bottom: 1px dotted var(--border); }
  .detail-ingredients li:last-child { border-bottom: none; }
  .tasting-entry { border-left: 2px solid var(--gold-dim); padding: 6px 0 6px 12px; margin-bottom: 8px; }
  .tasting-entry .meta { font-size: 12px; color: var(--text-faint); }
  .star-row { display: flex; gap: 4px; font-size: 22px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .star { color: var(--border-light); }
  .star.filled { color: var(--gold); }
  .loading-msg { text-align: center; color: var(--text-faint); padding: 50px; font-style: italic; }
  .status-bar { text-align: center; font-size: 12px; padding: 10px 16px 0; font-style: italic; color: var(--text-faint); }
  .status-bar.error { color: var(--red-bright); }
  .status-bar.ok { color: var(--gold); }
  .error-box { background: rgba(165,50,47,0.1); border: 1px solid var(--red-bright); color: var(--red-bright); padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; font-size: 14px; }

  /* ---- Bar Stock ---- */
  .category-title { align-items: center; gap: 10px; }
  .toolbar.hidden { display: none; }
  .tabs { max-width: 900px; margin: 14px auto 0; padding: 0 16px; display: flex; gap: 6px; }
  .tab { flex: 1; border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim); padding: 11px 12px; font-size: 14px; }
  .tab.active { border-color: var(--gold-dim); color: var(--gold-bright); background: rgba(201,162,74,0.12); }
  #stockSearch { flex: 1; min-width: 160px; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: rgba(201,162,74,0.08); border: 1px solid var(--gold-dim); border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 15px; color: var(--text-dim); }
  .banner b { color: var(--text); }
  .avail { margin-top: 6px; font-size: 13px; }
  .avail.ready { color: var(--ok); }
  .avail.almost { color: var(--ok); }
  .avail.missing { color: var(--bad); }
  .avail .low { color: var(--warn); }
  .stock-summary { color: var(--text-dim); font-style: italic; margin-bottom: 14px; font-size: 15px; }
  .stock-summary b { color: var(--text); font-style: normal; }
  .stock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-card); border: 1px solid var(--border); border-left-width: 3px; border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; }
  .stock-row.in { border-left-color: var(--ok); }
  .stock-row.low { border-left-color: var(--warn); }
  .stock-row.out { border-left-color: var(--bad); }
  .stock-main { flex: 1; min-width: 0; cursor: pointer; }
  .stock-name { font-family: var(--font-head); font-size: 16px; }
  .stock-meta { color: var(--text-faint); font-size: 13px; }
  .stock-meta .unlock { color: var(--gold); }
  .tag { font-family: var(--font-body); font-size: 11px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; letter-spacing: 0; vertical-align: middle; }
  .seg { display: flex; flex-shrink: 0; }
  .seg-btn { border-radius: 0; margin-left: -1px; padding: 9px 12px; min-width: 52px; min-height: 40px; color: var(--text-dim); border-color: var(--border-light); }
  .seg-btn:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .seg-btn:last-child { border-radius: 0 4px 4px 0; }
  .seg-btn.active.in { background: var(--ok); color: #101010; border-color: var(--ok); }
  .seg-btn.active.low { background: var(--warn); color: #101010; border-color: var(--warn); }
  .seg-btn.active.out { background: var(--bad); color: #101010; border-color: var(--bad); }
  :root[data-theme="light"] .seg-btn.active { color: #fff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .seg-btn.active { color: #fff; } }
  .stock-li { display: flex; align-items: center; gap: 8px; }
  .stock-li .sym { width: 1.2em; text-align: center; font-weight: 600; }
  .stock-li.in .sym { color: var(--ok); }
  .stock-li.low .sym { color: var(--warn); }
  .stock-li.out .sym { color: var(--bad); }
  .stock-state { margin-left: auto; font-size: 13px; color: var(--text-faint); font-style: italic; }
  .status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .status-dot.in { background: var(--ok); }
  .status-dot.low { background: var(--warn); }
  .status-dot.out { background: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 14px; padding: 2px 4px 2px 10px; font-size: 15px; }
  .chip button { padding: 2px 8px; font-size: 12px; }
  .needs-results { display: flex; flex-direction: column; align-items: flex-start; margin: 4px 0; }
  .needs-results button { text-align: left; white-space: normal; }
  #needsSearch { width: 100%; }
  @media (max-width: 560px) {
    #toolbarStock select { flex: 1 1 45%; min-width: 0; }
    #toolbarStock button { flex: 1 1 auto; }
    .stock-row { flex-wrap: wrap; }
    .seg { width: 100%; }
    .seg-btn { flex: 1; }
  }
  @media (max-width: 480px) { .modal { padding: 20px 16px; } }
</style>
</head>

  var SEED_DATA = [
    { id: "green-flash", category: "Old Fashioned Variations", status: "finalized", name: "Green Flash", spirit: "Bourbon (high-proof, e.g. Elijah Craig, Wild Turkey 101)", ingredients: ["2 oz bourbon (high-proof)","¼ oz green Chartreuse","2 dashes Angostura bitters","1 dash orange bitters (optional)","Orange peel (flamed)"], method: "Stir all with ice 25-30 sec, strain over large cube. Flame the orange peel: hold skin-side out toward the drink, pass a lit match between peel and glass, then sharply squeeze the peel to spray the oils through the flame. Drop the peel in.", notes: "Chartreuse replaces the sugar — no simple syrup needed. Start at ¼ oz, don't overdo it (110 proof). The flamed peel is the drink's namesake moment.", nameStory: "Named for the green flash: an optical phenomenon sometimes seen at sea right at sunset over the ocean.", source: "", tastingEntries: [] },
    { id: "spirit-room", category: "Old Fashioned Variations", status: "named", name: "Spirit Room", spirit: "Bourbon (Woodford Reserve Double Oaked recommended)", ingredients: ["2 oz bourbon","½ oz Magic Syrup (brown sugar, toasted coconut, butterscotch extract, vanilla extract)","2 dashes black walnut bitters","2 dashes chocolate bitters","Graham cracker rim or toasted marshmallow garnish"], method: "Rim rocks glass with honey + crushed graham crackers. Stir bourbon, syrup, bitters with ice 30 sec. Strain over one large ice sphere into prepared glass.", notes: "V2 improves on the original — single homemade Magic Syrup replaces separate coconut/butterscotch syrups.", nameStory: "A ship's \"spirit room\" was the actual compartment where liquor stores were kept — kept as final name, no rename needed.", source: "", tastingEntries: [] },
    { id: "marcys-windfall", category: "Old Fashioned Variations", status: "finalized", name: "Marcy's Windfall", spirit: "Bourbon (higher proof, 100+)", ingredients: ["2 oz bourbon (high proof)","½ oz banana liqueur","¼ oz Demerara syrup","2 dashes black walnut bitters","1 dash chocolate bitters","Nutmeg + banana chip garnish"], method: "Stir liquids with ice until well chilled, pour over one large cube in rocks glass, garnish with nutmeg + banana chip.", notes: "Use higher-proof bourbon (100+) or it can get too sweet.", nameStory: "Named for the user's sister-in-law Marcy, who this drink converted into an Old Fashioned fan. \"Windfall\" = an unexpected favorable wind / unexpected good fortune.", source: "", tastingEntries: [] },
    { id: "full-fathom-five", category: "Old Fashioned Variations", status: "finalized", name: "Full Fathom Five", spirit: "Split base — Knob Creek Smoked Maple bourbon + regular bourbon", ingredients: ["1 oz Knob Creek Smoked Maple bourbon","1 oz regular bourbon","¼ oz walnut liqueur (Nocino)","¼ oz maple syrup","2 dashes Angostura bitters","Orange peel"], method: "Stir all with ice, strain over one large cube, express orange peel over the drink.", notes: "Alt fat-wash version: 2 oz bourbon, ¼ oz maple syrup, 4 dashes Fee Brothers Browned Butter fat wash, lemon peel garnish — simpler build, worth taste-testing both.", nameStory: "From Shakespeare's The Tempest — \"something rich and strange.\"", source: "", tastingEntries: [] },
    { id: "stepes-even-keel", category: "Old Fashioned Variations", status: "named", name: "Stepe's Even Keel", spirit: "Bourbon", ingredients: ["Classic Old Fashioned ratios TBD"], method: "", notes: "Classic Old Fashioned with adjusted ratios for Stepe (Croatian, drink is a favorite of the ladies).", nameStory: "\"Even keel\" = balanced and steady, fitting since it's the classic ratio rebalanced.", source: "", tastingEntries: [] },
    { id: "roasted-duck-fat-boulevardier", category: "Bourbon & Rye Signatures", status: "draft", name: "Roasted Duck Fat Boulevardier", spirit: "Bourbon or rye", ingredients: ["2 oz bourbon or rye","1 oz Campari","1 oz sweet vermouth","5 dashes Fee Brothers Roasted Duck fat wash","Orange peel"], method: "Stir all with ice, strain, garnish with orange peel.", notes: "Reintroduces the Boulevardier concept after the plain classic was removed — fat wash makes it different enough to warrant its own entry. Needs a nautical name.", nameStory: "", source: "Personal recipe (Fee Brothers Fat Wash Drops)", tastingEntries: [] },
    { id: "bacon-vieux-carre", category: "Bourbon & Rye Signatures", status: "draft", name: "Bacon Vieux Carré", spirit: "Rye + cognac split base", ingredients: ["¾ oz rye","¾ oz sweet vermouth","¾ oz cognac (or ~1 oz B&B liqueur as a simplified substitute)","2 tsp Bénédictine (omit if using B&B)","4 dashes bitters (Peychaud's and/or Angostura)","4 dashes Fee Brothers Bacon fat wash","Lemon twist"], method: "Stir all with ice, strain, garnish with lemon twist.", notes: "Riff on the classic New Orleans Vieux Carré with a bacon fat wash added for smoky depth. Needs a nautical name.", nameStory: "", source: "Personal recipe (Fee Brothers Fat Wash Drops)", tastingEntries: [] },
    { id: "capn-wheel", category: "Bourbon & Rye Signatures", status: "draft", name: "The Cap'n's Wheel (placeholder name)", spirit: "Cap'n Crunch-infused bourbon/rye blend", ingredients: ["2 oz Cap'n Crunch-infused whiskey blend (3 cups Old Grand-Dad bonded bourbon + 1 cup Rittenhouse rye, infused 24 hrs with 2 cups Cap'n Crunch, then strained)","½ oz Lazzaroni amaretto","4 dashes Angostura bitters","4 dashes Bittermens Xocolatl mole bitters","Absinthe rinse","Piece of Cap'n Crunch cereal for garnish"], method: "Stir all (except absinthe) with ice, strain into absinthe-rinsed rocks glass, garnish.", notes: "User wants to call this \"Cap'n Crunch\" on their own personal menu; kept as a neutral placeholder name in this tracker since it's a trademarked character. Riff on The Godfather, created by Patrick Jennings at Andra Hem, Philadelphia.", nameStory: "", source: "Whisky Advocate", tastingEntries: [] },
    { id: "the-loggerhead", category: "Bourbon & Rye Signatures", status: "finalized", name: "The Loggerhead", spirit: "Bourbon (wheated, e.g. Maker's Mark)", ingredients: ["2 oz bourbon","¾ oz Magic Syrup (same as Spirit Room)","½ oz coconut cream (thick, canned)","1 whole egg","Grated dark chocolate + pinch sea salt garnish"], method: "Dry shake all (no ice) 20 sec to emulsify egg/coconut cream. Add ice, shake again 15 sec. Double strain into chilled coupe. Top with chocolate + salt.", notes: "Simplified from the original (crème de cacao + butterscotch schnapps) to reuse the Spirit Room's Magic Syrup. Flagged as very similar to Spirit Room — keeping both for now to compare after tasting.", nameStory: "A \"loggerhead\" was the red-hot iron rod historically plunged into flip drinks to warm and froth them — genuine flip-cocktail history.", source: "", tastingEntries: [] },
    { id: "kentucky-islander", category: "Bourbon & Rye Signatures", status: "named", name: "Kentucky Islander", spirit: "Bourbon", ingredients: ["2 oz bourbon","1 oz coconut syrup","¾ oz lime juice","2 dashes Angostura bitters","Coconut flakes (optional garnish)"], method: "Shake all with ice until chilled, strain into ice-filled chilled glass, garnish.", notes: "Shaken/tiki-leaning rather than stirred — different profile than the rest of this category. Already has a nautical-flavored name.", nameStory: "", source: "", tastingEntries: [] },
    { id: "smoke-and-brine-manhattan", category: "Bourbon & Rye Signatures", status: "finalized", name: "Smoke & Brine Manhattan", spirit: "Rye whiskey", ingredients: ["2 oz rye whiskey","1 oz sweet vermouth (Carpano Antica or Cocchi di Torino)","2 dashes Angostura bitters","2-3 drops saline solution (10:1 water:salt)","Luxardo cherry garnish"], method: "Stir rye, vermouth, bitters, and saline with ice 30 sec. Strain into rocks glass or coupe. Place under smoke dome (applewood/cherry wood) 15-30 sec, lift with flourish, garnish, serve.", notes: "Variations to try: swap saline for a light fino sherry rinse (short shelf life — buy small format); or add a barspoon rinse of peated Islay Scotch for smoke baked into the liquid itself.", nameStory: "States the drink's smoke dome + saline elements directly. Manhattan itself is reached by water.", source: "", tastingEntries: [] },
    { id: "squall-line", category: "Bourbon & Rye Signatures", status: "finalized", name: "Squall Line", spirit: "Rye (split base with Jamaican rum)", ingredients: ["¾ oz Rittenhouse bottled-in-bond rye (or other 100-proof rye)","¾ oz Jamaican rum","¾ oz Campari","½ oz fresh lime juice","½ oz demerara syrup","2 oz pineapple juice","Pineapple wedge garnish"], method: "Shake all ingredients with cubed ice 5-8 sec. Strain over fresh ice in a double old-fashioned glass. Garnish with pineapple wedge.", notes: "A rye-forward riff on the classic Jungle Bird.", nameStory: "A fast-moving storm front — keeps the punchy \"Thunder\" energy of the original name (formerly Thunder Bird), fully nautical.", source: "Whisky Advocate (Aug 2026)", tastingEntries: [] },
    { id: "the-dead-reckoning", category: "Bourbon & Rye Signatures", status: "finalized", name: "The Dead Reckoning", spirit: "Bourbon (Rabbit Hole Cavehill specified)", ingredients: ["2 oz bourbon","1 oz House Amaro Mix (equal parts Amaro Montenegro + Averna or Ramazzotti)","1 oz lemon simple syrup","¾ oz Aperol","¼ oz Fernet-Branca","Fresh lemon twist"], method: "Combine all in a shaker with ice, shake vigorously 12-15 sec, fine-strain into chilled coupe, garnish.", notes: "Riff on the classic Paper Plane — swaps a house amaro blend for Amaro Nonino, adds Fernet-Branca for extra bitterness.", nameStory: "Dead reckoning: navigating by estimated calculation rather than fixed landmarks — fitting since this riff estimates the classic's amaro component with a substitute blend.", source: "Personal email (Scott Davis)", tastingEntries: [] },
    { id: "the-undertow", category: "Bourbon & Rye Signatures", status: "finalized", name: "The Undertow", spirit: "Bourbon (Wild Turkey specified)", ingredients: ["1.5 oz bourbon","1 oz grapefruit juice","0.5 oz lemon juice","¾ oz honey-pineapple syrup","Lemon wheel garnish"], method: "Add all ingredients to a cocktail shaker with ice, shake, strain into ice-filled highball glass. Garnish with lemon wheel.", notes: "Single-serving conversion from a batch recipe (serves 4: 6 oz bourbon, 4 oz grapefruit juice, 2 oz lemon juice, 3 oz honey-pineapple syrup).", nameStory: "Undertow: a hidden, powerful current beneath the surface — echoes the \"unexpected strength\" idiom of the original name, Dark Horse.", source: "Magazine feature (image upload)", tastingEntries: [] },
    { id: "the-sirens-call", category: "Bourbon & Rye Signatures", status: "finalized", name: "The Siren's Call", spirit: "Split base — rye whiskey + dark rum (50% ABV)", ingredients: ["1 oz rye whiskey","1 oz dark rum (50% ABV)","1 oz Aperol","¾ oz sweet vermouth (Punt e Mes)","Optional 2 dashes orange bitters"], method: "Stir all ingredients with fresh ice for a full 30 seconds. Strain over one large ice cube into a Double Old Fashioned glass.", notes: "Split-base riff on the Boulevardier — dark rum replaces half the whiskey, Aperol replaces Campari for brighter, less medicinal bitterness. Garnish: \"Siren's Sail\" — wide orange peel cut into a sail shape, pierced with a black bamboo pick.", nameStory: "Mythological sea sirens, luring with sweetness then holding captive with bitterness.", source: "Personal recipe development", tastingEntries: [] },

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function(c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function slugify(name) {
    var base = String(name || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return (base || "cocktail") + "-" + Math.random().toString(36).slice(2, 7);
  }
  function statusLabel(s) {
    var found = STATUS_OPTIONS.filter(function(o){ return o.value === s; })[0];
    return found ? found.label : "Draft";
  }
  function menuStyleIngredient(s) {
    if (!s) return "";
    var cleaned = s.replace(/^(optional\s+)?[\d¼½¾⅓⅔.\-\s]*\s*(oz|ounces?|dash(?:es)?|teaspoons?|tsp|tablespoons?|tbsp|cups?|drops?|pinch(?:es)?|splash(?:es)?|ml)\b\.?\s*(of\s+)?/i, "");
    cleaned = cleaned.trim();
    if (!cleaned) return s.trim();
    return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
  }
  function menuStyleIngredientsLine(ingredients) {
    if (!ingredients || !ingredients.length) return "";
    return ingredients.map(menuStyleIngredient).join(", ");
  }
  function avgRating(entries) {
    if (!entries || !entries.length) return null;
    var withRating = entries.filter(function(e){ return typeof e.rating === "number" && e.rating > 0; });
    if (!withRating.length) return null;
    var sum = withRating.reduce(function(a,e){ return a + e.rating; }, 0);
    return sum / withRating.length;
  }
  function starsHtml(rating) {
    var full = Math.round(rating || 0);
    var out = "";
    for (var i = 1; i <= 5; i++) out += (i <= full) ? "★" : "☆";
    return out;
  }
  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));

  function base64ToUtf8(b64) {

  function loadSettings() {

    return null;

  function saveSettings(s) {
    try {

      return true;
    } catch (e) { console.error("settings save failed", e); return false; }
  }
  function loadLocalCache() {
    try {
      var raw = window.localStorage.getItem(LOCAL_CACHE_KEY);
      if (raw) { var p = JSON.parse(raw); if (p && Array.isArray(p.cocktails)) return p; }
    } catch (e) {}
    return null;
  }
  function saveLocalCache(sha) {
    try {
      window.localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ cocktails: cocktails, sha: sha || currentSha }));
    } catch (e) { console.error("local cache save failed", e); }
  }

  function githubUrl(path) {
    return "https://api.github.com/repos/" + encodeURIComponent(settings.owner) + "/" + encodeURIComponent(settings.repo) + "/contents/" + (path || settings.path).split("/").map(encodeURIComponent).join("/");
  }
  function githubHeaders() {
    return {
      "Authorization": "Bearer " + settings.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }

  // ---------- GitHub sync ----------

  function fetchFromGitHub() {
    if (!settings) return Promise.resolve(false);
    setStatus("Syncing with GitHub…");
    isSyncing = true;
    return fetch(githubUrl(), { headers: githubHeaders() }).then(function(resp) {
      if (resp.status === 404) {
        // File doesn't exist yet — create it with seed data
        return createInitialFile();
      }
      if (!resp.ok) {
        return resp.json().catch(function(){ return {}; }).then(function(body) {
          throw new Error("GitHub error " + resp.status + (body && body.message ? ": " + body.message : ""));
        });
      }
      return resp.json().then(function(body) {
        currentSha = body.sha;
        var decoded = base64ToUtf8(body.content);
        var parsed = JSON.parse(decoded);
        if (!Array.isArray(parsed)) throw new Error("Data file didn't contain a valid list");
        cocktails = parsed;
        saveLocalCache(currentSha);
        setStatus("Synced with GitHub just now.", "ok");
        return true;
      });
    }).catch(function(err) {
      console.error("fetch from GitHub failed", err);
      var cached = loadLocalCache();
      if (cached) {
        cocktails = cached.cocktails;
        currentSha = cached.sha;
        setStatus("Couldn't reach GitHub (" + err.message + ") — showing last saved copy from this device.", "error");
      } else {
        setStatus("Couldn't reach GitHub (" + err.message + ") and no local copy exists yet.", "error");
        cocktails = [];
      }
      return false;
    }).finally(function() {
      isSyncing = false;
      render();
    });
  }

  function createInitialFile() {
    setStatus("First time setup — creating your data file on GitHub…");
    var content = utf8ToBase64(JSON.stringify(SEED_DATA, null, 2));
    return fetch(githubUrl(), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, githubHeaders()),
      body: JSON.stringify({ message: "Initialize cocktail ledger", content: content })
    }).then(function(resp) {
      if (!resp.ok) {
        return resp.json().catch(function(){ return {}; }).then(function(body) {
          throw new Error("Couldn't create file: " + resp.status + (body && body.message ? " " + body.message : ""));
        });
      }
      return resp.json();
    }).then(function(body) {
      currentSha = body.content.sha;
      cocktails = SEED_DATA.slice();
      saveLocalCache(currentSha);
      setStatus("Created your data file on GitHub with starting recipes.", "ok");
      return true;
    });
  }

  function pushToGitHub(retrying) {
    if (!settings) {
      setStatus("Not connected to GitHub — changes are only saved on this device.", "error");
      saveLocalCache(null);
      return Promise.resolve(false);
    }
    setStatus("Saving to GitHub…");
    var content = utf8ToBase64(JSON.stringify(cocktails, null, 2));
    var payload = { message: "Update cocktail ledger", content: content };
    if (currentSha) payload.sha = currentSha;
    return fetch(githubUrl(), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, githubHeaders()),
      body: JSON.stringify(payload)
    }).then(function(resp) {
      if (resp.status === 409 && !retrying) {
        // sha conflict — someone else wrote in between. Refetch sha and retry once.
        return fetch(githubUrl(), { headers: githubHeaders() }).then(function(r2) {
          return r2.json();
        }).then(function(body2) {
          currentSha = body2.sha;
          return pushToGitHub(true);
        });
      }
      if (!resp.ok) {
        return resp.json().catch(function(){ return {}; }).then(function(body) {
          throw new Error("GitHub error " + resp.status + (body && body.message ? ": " + body.message : ""));
        });
      }
      return resp.json().then(function(body) {
        currentSha = body.content.sha;
        saveLocalCache(currentSha);
        setStatus("Saved to GitHub.", "ok");
        return true;
      });
    }).catch(function(err) {
      console.error("push to GitHub failed", err);
      saveLocalCache(currentSha);
      setStatus("Couldn't save to GitHub (" + err.message + ") — kept on this device only for now. Try Refresh later.", "error");
      return false;
    });
  }

  function buildSeedInventory() {
    return SEED_ITEM_ROWS.map(function(r) {
      return {
        id: r[0], name: r[1], category: r[2], kind: r[3], status: "out",
        aliases: r[4] ? r[4].split("|") : [],
        generic: r[5].indexOf("g") >= 0, minor: r[5].indexOf("m") >= 0, notes: r[6] || ""
      };
    });
  }
  function normalizeItem(it) {
    return {
      id: String(it.id || slugify(it.name)),
      name: String(it.name || "Unnamed item"),
      category: it.category || "Pantry & Specialty",
      kind: it.kind === "made" ? "made" : "bought",
      status: (it.status === "in" || it.status === "low") ? it.status : "out",
      aliases: Array.isArray(it.aliases) ? it.aliases.filter(Boolean) : [],
      generic: !!it.generic, minor: !!it.minor, notes: it.notes || ""
    };
  }
  function shortName(it) { return String(it.name).replace(/\s*\([^)]*\)/g, "").trim() || it.name; }

  // ---------- Recipe-line matching ----------

  function normText(s) {
    var t = String(s || "");
    try { t = t.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch (e) {}
    t = t.toLowerCase().replace(/[‘’ʼ]/g, "'").replace(/[^a-z0-9&'+%]+/g, " ").replace(/\s+/g, " ").trim();
    return " " + t + " ";
  }
  function aliasListFor(it) {
    var list = [];
    (it.aliases || []).forEach(function(a) { var n = normText(a); if (n.trim()) list.push(n); });
    var nm = normText(String(it.name || "").replace(/\([^)]*\)/g, " "));
    if (nm.trim()) list.push(nm);
    return list;
  }
  var aliasCache = null, itemMapCache = null;
  function invChanged() { aliasCache = null; itemMapCache = null; }
  function getItemMap() {
    if (!itemMapCache) { itemMapCache = {}; inventory.forEach(function(it) { itemMapCache[it.id] = it; }); }
    return itemMapCache;
  }
  function getAliasEntries() {
    if (aliasCache) return aliasCache;
    var entries = [];
    inventory.forEach(function(it) { aliasListFor(it).forEach(function(a) { entries.push({ item: it, alias: a }); }); });
    entries.sort(function(x, y) { return y.alias.length - x.alias.length; });
    aliasCache = entries;
    return entries;
  }
  // Finds items whose aliases appear as whole words; longest aliases claim text first.
  function findMatches(text) {
    var found = [];
    getAliasEntries().forEach(function(e) {
      var idx = text.indexOf(e.alias);
      if (idx === -1) return;
      text = text.slice(0, idx) + new Array(e.alias.length + 1).join(" ") + text.slice(idx + e.alias.length);
      if (found.indexOf(e.item) === -1) found.push(e.item);
    });
    return found;
  }
  // One recipe line -> the stock items it needs.
  function matchLine(line) {
    if (!line || /\boptional\b/i.test(line)) return [];
    var inside = (String(line).match(/\([^)]*\)/g) || []).join(" ");
    var outsideRaw = String(line).replace(/\([^)]*\)/g, " ");
    var firstAlt = outsideRaw.split(/\s+or\s+/i)[0];      // "bourbon or rye" -> bourbon
    var out = findMatches(normText(firstAlt));
    var outSpecific = out.filter(function(it) { return !it.generic; });
    if (outSpecific.length) return outSpecific;
    var inn = inside ? findMatches(normText(inside)) : [];
    // A parenthetical only refines the ingredient when it names the same kind of thing:
    // "bourbon (high-proof)" -> high-proof bourbon, but "rye (or other 100-proof rye)" stays rye.
    var inSpecific = inn.filter(function(it) {
      if (it.generic) return false;
      if (!out.length) return true;
      var nameN = normText(it.name);
      return out.some(function(g) { return aliasListFor(g).some(function(a) { return nameN.indexOf(a) !== -1; }); });
    });
    if (inSpecific.length) return [inSpecific[0]];         // "sweet vermouth (Punt e Mes)" -> Punt e Mes
    if (out.length) return [out[0]];
    if (inn.length) return [inn[0]];
    return [];
  }
  function suggestFromLines(lines) {
    var ids = [], unmatched = [];
    (lines || []).forEach(function(line) {
      if (!line || /\boptional\b/i.test(line)) return;
      var m = matchLine(line);
      if (!m.length) { unmatched.push(line); return; }
      m.forEach(function(it) { if (ids.indexOf(it.id) === -1) ids.push(it.id); });
    });
    return { ids: ids, unmatched: unmatched };
  }

  // ---------- Availability ----------

  function availability(c) {
    if (!invReady || !Array.isArray(c.needs) || !c.needs.length) return null;
    var map = getItemMap();
    var missing = [], missingMinor = [], low = [];
    c.needs.forEach(function(id) {
      var it = map[id];
      if (!it) return;
      if (it.status === "out") (it.minor ? missingMinor : missing).push(it);
      else if (it.status === "low") low.push(it);
    });
    return { state: missing.length ? "missing" : (missingMinor.length ? "almost" : "ready"), missing: missing, missingMinor: missingMinor, low: low };
  }
  function usedIn(itemId) {
    return cocktails.filter(function(c) { return Array.isArray(c.needs) && c.needs.indexOf(itemId) !== -1; });
  }
  // item id -> number of drinks that would become makeable if only that item were restocked
  function computeUnlocks() {
    var map = {};
    cocktails.forEach(function(c) {
      var a = availability(c);
      if (a && a.state === "missing" && a.missing.length === 1) map[a.missing[0].id] = (map[a.missing[0].id] || 0) + 1;
    });
    return map;
  }
  function namesList(arr, max) {
    var n = arr.map(shortName);
    return n.slice(0, max).join(", ") + (n.length > max ? " +" + (n.length - max) + " more" : "");
  }
  function availabilityHtml(c) {
    var a = availability(c);
    if (!a) return "";
    if (a.state === "missing") return '<div class="avail missing">✕ Missing: ' + escapeHtml(namesList(a.missing, 3)) + '</div>';
    var s = '<div class="avail ' + a.state + '">✓ Ready to make';
    if (a.state === "almost") s += ' <span class="low">(no ' + escapeHtml(namesList(a.missingMinor, 3)) + ')</span>';
    if (a.low.length) s += ' <span class="low">· running low: ' + escapeHtml(namesList(a.low, 3)) + '</span>';
    return s + '</div>';
  }
  function stockCheckHtml(c) {
    if (!invReady) return "";
    var body;
    if (!Array.isArray(c.needs) || !c.needs.length) {
      body = '<div style="color:var(--text-faint);font-style:italic;">Not linked to your Bar Stock yet — tap Edit to link ingredients.</div>';
    } else {
      var map = getItemMap();
      var items = c.needs.map(function(id) { return map[id]; }).filter(Boolean);
      var order = { "out": 0, "low": 1, "in": 2 };
      items.sort(function(a, b) { return (order[a.status] - order[b.status]) || a.name.localeCompare(b.name); });
      body = '<ul class="detail-ingredients">' + items.map(function(it) {
        var sym = it.status === "in" ? "✓" : (it.status === "low" ? "◐" : "✕");
        var lab = it.status === "in" ? (it.kind === "made" ? "made" : "in stock") : (it.status === "low" ? "running low" : (it.kind === "made" ? "need to make" : "out"));
        return '<li class="stock-li ' + it.status + '"><span class="sym">' + sym + '</span> ' + escapeHtml(shortName(it)) +
          (it.minor ? ' <span style="color:var(--text-faint);font-size:13px;">(garnish/extra)</span>' : '') +
          '<span class="stock-state">' + lab + '</span></li>';
      }).join("") + '</ul>';
    }
    return '<div class="detail-section"><div class="detail-label">Stock Check</div>' + body + '</div>';
  }

  // ---------- Bar Stock persistence & sync ----------

  function loadInventoryCache() {
    try {
      var raw = window.localStorage.getItem(INV_CACHE_KEY);
      if (raw) { var p = JSON.parse(raw); if (p && Array.isArray(p.items)) return p; }
    } catch (e) {}
    return null;
  }
  function saveInventoryCache() {
    try { window.localStorage.setItem(INV_CACHE_KEY, JSON.stringify({ items: inventory, sha: invSha })); }
    catch (e) { console.error("inventory cache save failed", e); }
  }
  function inventoryPath() {
    return String((settings && settings.path) || "cocktails.json").replace(/[^\/]*$/, "") + "inventory.json";
  }
  function useSeedInventory() {
    inventory = buildSeedInventory(); invChanged();
  }

  function fetchInventory() {
    if (!settings) return Promise.resolve(false);
    invSyncing = true;
    return fetch(githubUrl(inventoryPath()), { headers: githubHeaders() }).then(function(resp) {
      if (resp.status === 404) return createInventoryFile();
      if (!resp.ok) {
        return resp.json().catch(function() { return {}; }).then(function(body) {
          throw new Error("GitHub error " + resp.status + (body && body.message ? ": " + body.message : ""));
        });
      }
      return resp.json().then(function(body) {
        invSha = body.sha;
        var parsed = JSON.parse(base64ToUtf8(body.content));
        var items = Array.isArray(parsed) ? parsed : (parsed && parsed.items);
        if (!Array.isArray(items)) throw new Error("Bar Stock file didn't contain a valid list");
        inventory = items.map(normalizeItem); invChanged();
        invReady = true;
        saveInventoryCache();
        return true;
      });
    }).catch(function(err) {
      console.error("fetch inventory failed", err);
      var cached = loadInventoryCache();
      if (cached) {
        inventory = cached.items.map(normalizeItem); invChanged();
        invSha = cached.sha; invReady = true;
        setStatus("Couldn't reach GitHub for Bar Stock (" + err.message + ") — showing the last saved copy from this device.", "error");
      } else {
        setStatus("Couldn't load Bar Stock from GitHub (" + err.message + "). Check GitHub Settings, then tap Refresh.", "error");
      }
      return false;
    }).finally(function() {
      invSyncing = false;
      render();
    });
  }
  function createInventoryFile() {
    useSeedInventory();
    var content = utf8ToBase64(JSON.stringify({ version: 1, items: inventory }, null, 2));
    return fetch(githubUrl(inventoryPath()), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, githubHeaders()),
      body: JSON.stringify({ message: "Initialize bar stock", content: content })
    }).then(function(resp) {
      if (!resp.ok) {
        return resp.json().catch(function() { return {}; }).then(function(body) {
          throw new Error("Couldn't create the Bar Stock file: " + resp.status + (body && body.message ? " " + body.message : ""));
        });
      }
      return resp.json();
    }).then(function(body) {
      invSha = body.content.sha; invReady = true;
      saveInventoryCache();
      setStatus("Created your Bar Stock list on GitHub. Tap what you have on the shelf.", "ok");
      return true;
    });
  }
  function putInventory(retrying) {
    var content = utf8ToBase64(JSON.stringify({ version: 1, items: inventory }, null, 2));
    var payload = { message: "Update bar stock", content: content };
    if (invSha) payload.sha = invSha;
    return fetch(githubUrl(inventoryPath()), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, githubHeaders()),
      body: JSON.stringify(payload)
    }).then(function(resp) {
      if ((resp.status === 409 || resp.status === 422) && !retrying) {
        return fetch(githubUrl(inventoryPath()), { headers: githubHeaders() }).then(function(r2) {
          return r2.ok ? r2.json() : { sha: null };
        }).then(function(b2) { invSha = b2.sha || null; return putInventory(true); });
      }
      if (!resp.ok) {
        return resp.json().catch(function() { return {}; }).then(function(body) {
          throw new Error("GitHub error " + resp.status + (body && body.message ? ": " + body.message : ""));
        });
      }
      return resp.json().then(function(body) {
        invSha = body.content.sha;
        saveInventoryCache();
        setStatus("Saved Bar Stock to GitHub.", "ok");
        return true;
      });
    }).catch(function(err) {
      console.error("push inventory failed", err);
      saveInventoryCache();
      setStatus("Couldn't save Bar Stock to GitHub (" + err.message + ") — kept on this device only for now. Your next change will try saving again.", "error");
      return false;
    });
  }
  // Taps are batched and sent one at a time so rapid toggling never races on the file's sha.
  function scheduleInventoryPush() {
    saveInventoryCache();
    if (!settings) { setStatus("Not connected to GitHub — Bar Stock changes are only saved on this device.", "error"); return; }
    invDirty = true;
    if (invTimer) clearTimeout(invTimer);
    setStatus("Saving Bar Stock…");
    invTimer = setTimeout(runInventoryPush, 600);
  }
  function runInventoryPush() {
    invTimer = null;
    if (invInFlight || !invDirty) return;
    invInFlight = true; invDirty = false;
    putInventory(false).then(function() {
      invInFlight = false;
      if (invDirty) runInventoryPush();
    });
  }

  function refreshAll() {
    isSyncing = true; invSyncing = true;
    render();
    fetchFromGitHub();
    fetchInventory();
  }

  // ======================================================================
  // BAR STOCK — views, modals, linking
  // ======================================================================

  function render() {
    if (currentView === "stock") renderStock(); else renderCocktails();
  }

  function setView(v, userInitiated) {
    currentView = (v === "stock") ? "stock" : "cocktails";
    toolbarCocktails.classList.toggle("hidden", currentView !== "cocktails");
    toolbarStock.classList.toggle("hidden", currentView !== "stock");
    tabCocktails.classList.toggle("active", currentView === "cocktails");
    tabStock.classList.toggle("active", currentView === "stock");
    tabCocktails.setAttribute("aria-pressed", currentView === "cocktails" ? "true" : "false");
    tabStock.setAttribute("aria-pressed", currentView === "stock" ? "true" : "false");
    try { history.replaceState(null, "", currentView === "stock" ? "#stock" : "#cocktails"); } catch (e) {}
    if (userInitiated) window.scrollTo(0, 0);
    render();
  }

  // ---------- Cocktail page helpers ----------

  function buildCocktailBanners() {
    if (!invReady || !cocktails.length) return "";
    var html = "";
    var haveStock = inventory.some(function(i) { return i.status !== "out"; });
    var unlinked = cocktails.filter(function(c) { return !Array.isArray(c.needs); }).length;
    if (!haveStock) {
      html += '<div class="banner"><span>Your Bar Stock is empty, so no drink can show as ready yet. Tell the ledger what is on your shelf.</span>' +
        '<button class="primary" data-act="gostock">Set up Bar Stock</button></div>';
    }
    if (unlinked) {
      html += '<div class="banner"><span><b>' + unlinked + '</b> cocktail' + (unlinked === 1 ? " isn't" : "s aren't") +
        ' linked to your ingredients yet, so ' + (unlinked === 1 ? "it" : "they") + " can't show whether you can make " + (unlinked === 1 ? "it" : "them") + '.</span>' +
        '<button class="primary" data-act="autolink">Auto-link from recipes</button></div>';
    }
    return html;
  }

  function autoLinkAll() {
    var n = 0;
    cocktails.forEach(function(c) {
      if (Array.isArray(c.needs)) return;
      c.needs = suggestFromLines(c.ingredients || []).ids;
      n++;
    });
    if (!n) return;
    render();
    setStatus("Linking " + n + " cocktail" + (n === 1 ? "" : "s") + " to your Bar Stock…");
    pushToGitHub().then(function(ok) {
      if (ok) setStatus("Linked " + n + " cocktail" + (n === 1 ? "" : "s") + " to your ingredients. Open any drink and tap Edit to fine-tune its links.", "ok");
    });
  }

  // ---------- Bar Stock page ----------

  function stockVisible(it) {
    if (stockFilter.category && it.category !== stockFilter.category) return false;
    if (stockFilter.show === "need" && it.status === "in") return false;
    if (stockFilter.show === "out" && it.status !== "out") return false;
    if (stockFilter.show === "in" && it.status === "out") return false;
    if (stockFilter.search) {
      var q = normText(stockFilter.search).trim();
      var hay = normText(it.name + " " + (it.aliases || []).join(" ") + " " + (it.notes || ""));
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function renderStock() {
    if (invSyncing && !invReady) { mainEl.innerHTML = '<div class="loading-msg">Counting the bottles…</div>'; return; }
    if (!invReady) {
      mainEl.innerHTML = '<div class="empty-state">Bar Stock couldn\'t be loaded. Check GitHub Settings, then tap Refresh.</div>';
      return;
    }
    var y = window.pageYOffset || 0;
    var nIn = 0, nLow = 0, nOut = 0;
    inventory.forEach(function(i) { if (i.status === "in") nIn++; else if (i.status === "low") nLow++; else nOut++; });
    var linked = cocktails.filter(function(c) { return availability(c); });
    var ready = linked.filter(function(c) { return availability(c).state !== "missing"; }).length;
    var unlocks = computeUnlocks();

    var html = '<div class="stock-summary">' + nIn + ' in stock · ' + nLow + ' low · ' + nOut + ' out' +
      (linked.length ? ' · <b>' + ready + ' of ' + linked.length + '</b> linked drinks ready to make' : '') + '</div>';
    if (nIn + nLow === 0) {
      html += '<div class="banner"><span>Nothing is marked as in stock yet. Tap <b>In</b> on what you have, or use <b>Mark all in</b> on a category and then flip the few you\'re out of.</span></div>';
    }

    var visible = inventory.filter(stockVisible);
    if (!visible.length) {
      mainEl.innerHTML = html + '<div class="empty-state">Nothing matches that search or filter.</div>';
      return;
    }
    var byCat = {};
    visible.forEach(function(it) { (byCat[it.category] = byCat[it.category] || []).push(it); });
    var order = INV_CATEGORIES.concat(Object.keys(byCat).filter(function(c) { return INV_CATEGORIES.indexOf(c) === -1; }));

    order.forEach(function(cat) {
      var items = byCat[cat];
      if (!items || !items.length) return;
      items.sort(function(a, b) { return a.name.localeCompare(b.name); });
      var all = inventory.filter(function(i) { return i.category === cat; });
      var inCount = all.filter(function(i) { return i.status !== "out"; }).length;
      var anyNotIn = items.some(function(i) { return i.status !== "in"; });
      html += '<div class="category-group">';
      html += '<div class="category-title"><span>' + escapeHtml(cat) + ' <span class="category-count">' + inCount + ' of ' + all.length + ' on hand</span></span>' +
        (anyNotIn ? '<button class="ghost" data-act="markgroup" data-cat="' + escapeHtml(cat) + '">Mark all in</button>' : '') + '</div>';
      items.forEach(function(it) {
        var used = usedIn(it.id).length;
        var meta = [];
        if (used) meta.push('in ' + used + (used === 1 ? ' drink' : ' drinks'));
        if (it.status === "out" && unlocks[it.id]) meta.push('<span class="unlock">unlocks ' + unlocks[it.id] + (unlocks[it.id] === 1 ? ' drink' : ' drinks') + '</span>');
        if (it.notes) meta.push(escapeHtml(it.notes));
        html += '<div class="stock-row ' + it.status + '">' +
          '<div class="stock-main" data-act="edititem" data-id="' + escapeHtml(it.id) + '">' +
            '<div class="stock-name">' + escapeHtml(it.name) + (it.minor ? ' <span class="tag">garnish/extra</span>' : '') + '</div>' +
            (meta.length ? '<div class="stock-meta">' + meta.join(' · ') + '</div>' : '') +
          '</div>' +
          '<div class="seg">' + ["in", "low", "out"].map(function(st) {
            return '<button type="button" class="seg-btn ' + st + (it.status === st ? ' active' : '') + '" data-act="setstatus" data-id="' + escapeHtml(it.id) +
              '" data-st="' + st + '" aria-pressed="' + (it.status === st ? "true" : "false") + '">' + STOCK_LABELS[it.kind][st] + '</button>';
          }).join("") + '</div>' +
        '</div>';
      });
      html += '</div>';
    });
    mainEl.innerHTML = html;
    window.scrollTo(0, y);
  }

  function setItemStatus(id, st) {
    var it = getItemMap()[id];
    if (!it || it.status === st) return;
    it.status = st;
    render();
    scheduleInventoryPush();
  }
  function markGroupIn(cat) {
    var n = 0;
    inventory.filter(function(i) { return i.category === cat && stockVisible(i); }).forEach(function(i) {
      if (i.status !== "in") { i.status = "in"; n++; }
    });
    if (!n) return;
    render();
    scheduleInventoryPush();
  }
  function createItemQuick(name) {
    var it = normalizeItem({ id: slugify(name), name: name, category: "Pantry & Specialty", kind: "bought", status: "out", aliases: [name] });
    inventory.push(it);
    invChanged();
    scheduleInventoryPush();
    return it;
  }

        usedHtml +

      };

      var changed = false;
      cocktails.forEach(function(c) {
        if (Array.isArray(c.needs) && c.needs.indexOf(it.id) !== -1) { c.needs = c.needs.filter(function(id) { return id !== it.id; }); changed = true; }
      });

  // ---------- Shopping list ----------

  function buildShoppingText() {
    var unl = computeUnlocks();
    var need = inventory.filter(function(i) { return i.status !== "in"; });
    if (!need.length) return "";
    function section(kind, title) {
      var items = need.filter(function(i) { return i.kind === kind; });
      if (!items.length) return "";
      var byCat = {};
      items.forEach(function(i) { (byCat[i.category] = byCat[i.category] || []).push(i); });
      var cats = INV_CATEGORIES.concat(Object.keys(byCat).filter(function(c) { return INV_CATEGORIES.indexOf(c) === -1; }));
      var out = title + "\n";
      cats.forEach(function(cat) {
        var arr = byCat[cat];
        if (!arr) return;
        arr.sort(function(a, b) { return (unl[b.id] || 0) - (unl[a.id] || 0) || a.name.localeCompare(b.name); });
        out += "\n" + cat + "\n";
        arr.forEach(function(i) {
          out += "- " + shortName(i) + (i.status === "low" ? " (running low)" : "") +
            (unl[i.id] ? " — unlocks " + unl[i.id] + (unl[i.id] === 1 ? " drink" : " drinks") : "") + "\n";
        });
      });
      return out;
    }
    var parts = [section("bought", "TO BUY"), section("made", "TO MAKE")].filter(Boolean);
    return parts.join("\n");
  }

  function openShoppingModal() {
    var text = buildShoppingText();
    var count = inventory.filter(function(i) { return i.status !== "in"; }).length;
    modalRoot.innerHTML =
      '<div class="modal-overlay" id="overlay"><div class="modal">' +
        '<div class="modal-close-row"><button class="ghost" id="closeBtn">✕ Close</button></div>' +
        '<h2>Shopping List</h2>' +
        '<div style="color:var(--text-dim);margin-bottom:12px;">' + (count ? count + ' item' + (count === 1 ? '' : 's') + ' out or running low. Items that would unlock the most drinks are listed first within each category.' : 'Everything is in stock.') + '</div>' +
        (count ? '<textarea id="shopText" rows="14" readonly style="width:100%;font-size:15px;"></textarea>' : '') +
        '<div class="modal-actions"><div class="left">' + (count ? '<button class="primary" id="copyListBtn">Copy list</button>' : '') + '</div>' +
          (count ? '<button id="stockAllBtn">Mark all as stocked</button>' : '') + '</div>' +
      '</div></div>';
    if (count) document.getElementById("shopText").value = text;
    document.getElementById("closeBtn").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeModal(); });
    var copyBtn = document.getElementById("copyListBtn");
    if (copyBtn) copyBtn.addEventListener("click", function() {
      var ta = document.getElementById("shopText");
      function done() { copyBtn.textContent = "Copied ✓"; }
      function fallback() {
        ta.focus(); ta.select();
        try { ta.setSelectionRange(0, ta.value.length); document.execCommand("copy"); done(); } catch (e) { copyBtn.textContent = "Select the text and copy"; }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
      else fallback();
    });
    var allBtn = document.getElementById("stockAllBtn");
    if (allBtn) allBtn.addEventListener("click", function() {
      if (!confirm("Mark all " + count + " listed items as in stock? Do this after you've shopped and made your prep items.")) return;
      inventory.forEach(function(i) { i.status = "in"; });
      closeModal();
      render();
      scheduleInventoryPush();
    });
  }

  // ---------- Ingredient picker inside the cocktail editor ----------

  function setupNeedsPicker(c, isExisting, getLines) {
    var state = {
      needs: Array.isArray(c.needs) ? c.needs.slice() : (isExisting ? suggestFromLines(c.ingredients || []).ids : []),
      touched: false
    };
    var autoFilled = isExisting && !Array.isArray(c.needs) && state.needs.length > 0;
    var box = document.getElementById("needsBox");
    if (!invReady) {
      box.innerHTML = '<div class="hint">Bar Stock isn\'t loaded yet, so ingredients can\'t be linked right now. Connect to GitHub and tap Refresh.</div>';
      return { active: false, state: state };
    }
    box.innerHTML =
      '<div class="chips" id="needsChips"></div>' +
      '<input type="text" id="needsSearch" placeholder="Search Bar Stock to add an ingredient…" autocomplete="off">' +
      '<div class="needs-results" id="needsResults"></div>' +
      '<button class="ghost" id="suggestNeedsBtn" type="button">Suggest from the ingredients above</button>' +
      '<div class="hint" id="needsHint"></div>';
    var chipsEl = document.getElementById("needsChips");
    var searchEl = document.getElementById("needsSearch");
    var resultsEl = document.getElementById("needsResults");
    var hintEl = document.getElementById("needsHint");
    if (autoFilled) hintEl.textContent = "Suggested from the recipe — adjust if anything is off.";
    else if (!isExisting) hintEl.textContent = "Leave this empty and the ledger will link the ingredients above automatically when you save.";
    else if (Array.isArray(c.needs)) hintEl.textContent = "If you change the ingredient lines above, tap Suggest to pick up new items.";

    function draw() {
      var map = getItemMap();
      chipsEl.innerHTML = state.needs.map(function(id) {
        var it = map[id];
        if (!it) return "";
        return '<span class="chip"><span class="status-dot ' + it.status + '"></span>' + escapeHtml(shortName(it)) +
          '<button type="button" class="ghost" data-rm="' + escapeHtml(id) + '" aria-label="Remove">✕</button></span>';
      }).join("") || '<span style="color:var(--text-faint);font-style:italic;">Nothing linked yet</span>';
      var q = normText(searchEl.value).trim();
      var html = "";
      if (q) {
        inventory.filter(function(it) {
          if (state.needs.indexOf(it.id) !== -1) return false;
          return normText(it.name + " " + (it.aliases || []).join(" ")).indexOf(q) !== -1;
        }).slice(0, 8).forEach(function(it) {
          html += '<button type="button" class="ghost" data-add="' + escapeHtml(it.id) + '"><span class="status-dot ' + it.status + '"></span>+ ' + escapeHtml(shortName(it)) + '</button>';
        });
        var exact = inventory.some(function(it) { return normText(it.name).trim() === q; });
        if (!exact) html += '<button type="button" class="ghost" data-new="1">+ Add “' + escapeHtml(searchEl.value.trim()) + '” to Bar Stock as a new item</button>';
      }
      resultsEl.innerHTML = html;
    }
    chipsEl.addEventListener("click", function(e) {
      var b = e.target.closest ? e.target.closest("[data-rm]") : null;
      if (!b) return;
      var id = b.getAttribute("data-rm");
      state.needs = state.needs.filter(function(x) { return x !== id; });
      state.touched = true;
      draw();
    });
    resultsEl.addEventListener("click", function(e) {
      var b = e.target.closest ? e.target.closest("button") : null;
      if (!b) return;
      if (b.getAttribute("data-add")) {
        state.needs.push(b.getAttribute("data-add"));
      } else if (b.getAttribute("data-new")) {
        var nm = searchEl.value.trim();
        if (!nm) return;
        state.needs.push(createItemQuick(nm).id);
      } else return;
      state.touched = true;
      searchEl.value = "";
      draw();
    });
    searchEl.addEventListener("input", draw);
    document.getElementById("suggestNeedsBtn").addEventListener("click", function() {
      var r = suggestFromLines(getLines());
      var added = 0;
      r.ids.forEach(function(id) { if (state.needs.indexOf(id) === -1) { state.needs.push(id); added++; } });
      state.touched = true;
      hintEl.textContent = (added ? "Added " + added + " from the recipe. " : "Nothing new to add from the recipe. ") +
        (r.unmatched.length ? "No Bar Stock match for: " + r.unmatched.join("; ") + "." : "");
      draw();
    });
    draw();
    return { active: true, state: state };
  }

  // ---------- Rendering ----------

  function renderCocktails() {
    if (isSyncing) {
      mainEl.innerHTML = '<div class="loading-msg">Uncorking the ledger…</div>';
      return;
    }
    var filtered = cocktails.filter(function(c) {
      if (currentFilter.category && c.category !== currentFilter.category) return false;
      if (currentFilter.status && c.status !== currentFilter.status) return false;
      if (currentFilter.avail) {
        var av = availability(c);
        var st = av ? av.state : "none";
        if (currentFilter.avail === "ready" && !(st === "ready" || st === "almost")) return false;
        if (currentFilter.avail === "missing" && st !== "missing") return false;
        if (currentFilter.avail === "unlinked" && st !== "none") return false;
      }
      if (currentFilter.search) {
        var q = currentFilter.search.toLowerCase();
        var hay = [c.name || "", (c.ingredients || []).join(" "), c.spirit || "", c.notes || ""].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (!cocktails.length) {
      mainEl.innerHTML = '<div class="empty-state">No cocktails yet. Add your first one to start the ledger.</div>';
      return;
    }
    if (!filtered.length) {
      mainEl.innerHTML = buildCocktailBanners() + '<div class="empty-state">Nothing matches — try a different search or filter.</div>';
      return;
    }

    var byCategory = {};
    filtered.forEach(function(c) {
      var cat = c.category || "Uncategorized";
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(c);
    });
    var order = CATEGORIES.concat(Object.keys(byCategory).filter(function(c){ return CATEGORIES.indexOf(c) === -1; }));

    var html = buildCocktailBanners();
    order.forEach(function(cat) {
      var items = byCategory[cat];
      if (!items || !items.length) return;
      html += '<div class="category-group">';
      html += '<div class="category-title"><span>' + escapeHtml(cat) + '</span><span class="category-count">' + items.length + '</span></div>';
      items.forEach(function(c) {
        var rating = avgRating(c.tastingEntries);
        html += '<div class="card" data-id="' + escapeHtml(c.id) + '">';
        html += '<div class="card-top">';
        html += '<div class="card-name">' + escapeHtml(c.name || "Untitled") + '</div>';
        html += '<div class="status-pill status-' + escapeHtml(c.status || "draft") + '">' + escapeHtml(statusLabel(c.status)) + '</div>';
        html += '</div>';
        if (c.spirit) html += '<div class="card-spirit">' + escapeHtml(c.spirit) + '</div>';
        var ingLine = menuStyleIngredientsLine(c.ingredients);
        if (ingLine) html += '<div class="card-ingredients">' + escapeHtml(ingLine) + '</div>';
        html += availabilityHtml(c);
        if (rating !== null) html += '<div class="card-rating">' + starsHtml(rating) + ' <span style="color:var(--text-faint);font-size:12px;">(' + rating.toFixed(1) + ')</span></div>';
        html += '</div>';
      });
      html += '</div>';
    });
    mainEl.innerHTML = html;

    Array.prototype.forEach.call(mainEl.querySelectorAll(".card"), function(el) {
      el.addEventListener("click", function() {
        var id = el.getAttribute("data-id");
        var c = cocktails.filter(function(x){ return x.id === id; })[0];
        if (c) openDetailModal(c);
      });
    });
  }

      '<div class="modal-overlay" id="overlay">' +

          '<div class="detail-section">' +
            '<div class="detail-label">Taste Test Notes' + (rating !== null ? ' — avg ' + starsHtml(rating) + ' (' + rating.toFixed(1) + ')' : '') + '</div>' +
            '<div id="tastingList">' + (tastingHtml || '<div style="color:var(--text-faint);font-style:italic;">No notes yet.</div>') + '</div>' +
            '<div style="margin-top:10px;">' +
              '<div class="star-row" id="newStarRow" data-rating="0">' + [1,2,3,4,5].map(function(i){ return '<span class="star" data-val="' + i + '">☆</span>'; }).join("") + '</div>' +
              '<textarea id="newNoteText" rows="2" placeholder="Add a tasting note…" style="width:100%;"></textarea>' +
              '<button class="primary" id="addNoteBtn" style="margin-top:8px;">Add Note</button>' +
            '</div>' +
          '</div>' +
          '<div class="modal-actions"><div class="left"><button id="editBtn">Edit</button><button class="danger" id="deleteBtn">Delete</button></div></div>' +
        '</div>' +
      '</div>';
    modalRoot.innerHTML = html;

    document.getElementById("closeBtn").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeModal(); });
    document.getElementById("editBtn").addEventListener("click", function() { openEditModal(c); });
    document.getElementById("deleteBtn").addEventListener("click", function() {
      if (confirm('Delete "' + (c.name || "this cocktail") + '" permanently?')) { deleteCocktail(c.id); closeModal(); }
    });
    var starRow = document.getElementById("newStarRow");
    Array.prototype.forEach.call(starRow.querySelectorAll(".star"), function(starEl) {
      starEl.addEventListener("click", function() {
        var val = parseInt(starEl.getAttribute("data-val"), 10);
        starRow.setAttribute("data-rating", String(val));
        Array.prototype.forEach.call(starRow.querySelectorAll(".star"), function(s2) {
          var v2 = parseInt(s2.getAttribute("data-val"), 10);
          s2.textContent = v2 <= val ? "★" : "☆";
          s2.classList.toggle("filled", v2 <= val);
        });
      });
    });
    document.getElementById("addNoteBtn").addEventListener("click", function() {
      var note = document.getElementById("newNoteText").value.trim();
      var rating = parseInt(starRow.getAttribute("data-rating"), 10) || 0;
      if (!note && !rating) return;
      addTastingNote(c.id, note, rating);
      closeModal();
    });
  }

  function openEditModal(existing) {
    var c = existing || {};
    var isNew = !existing;
    var ingredients = (c.ingredients || [""]).slice();
    if (!ingredients.length) ingredients = [""];

    function ingredientsRowsHtml() {
      return ingredients.map(function(val) {
        return '<div class="ingredient-row"><input type="text" class="ingredient-input" value="' + escapeHtml(val) + '" placeholder="e.g. 2 oz bourbon"><button class="ghost removeIngBtn" type="button">✕</button></div>';
      }).join("");
    }
    var catOptionsHtml = CATEGORIES.map(function(cat) {
      return '<option value="' + escapeHtml(cat) + '"' + (c.category === cat ? " selected" : "") + '>' + escapeHtml(cat) + '</option>';
    }).join("");
    var statusOptionsHtml = STATUS_OPTIONS.map(function(o) {
      return '<option value="' + o.value + '"' + (c.status === o.value ? " selected" : "") + '>' + o.label + '</option>';
    }).join("");

    var html = '' +
      '<div class="modal-overlay" id="overlay">' +
        '<div class="modal">' +
          '<div class="modal-close-row"><button class="ghost" id="closeBtn">✕ Close</button></div>' +
          '<h2>' + (isNew ? "Add Cocktail" : "Edit Cocktail") + '</h2>' +
          '<div class="field"><label>Name</label><input type="text" id="f_name" value="' + escapeHtml(c.name || "") + '" placeholder="e.g. The Siren' + "'" + 's Call"></div>' +
          '<div class="field"><label>Category</label><select id="f_category">' + catOptionsHtml + '</select></div>' +
          '<div class="field"><label>Status</label><select id="f_status">' + statusOptionsHtml + '</select></div>' +
          '<div class="field"><label>Spirit / Base</label><input type="text" id="f_spirit" value="' + escapeHtml(c.spirit || "") + '" placeholder="e.g. Bourbon, high-proof"></div>' +
          '<div class="field"><label>Ingredients</label><div id="ingredientsList">' + ingredientsRowsHtml() + '</div><button class="ghost" id="addIngBtn" type="button">+ Add Ingredient</button></div>' +
          '<div class="field"><label>Linked Bar Stock items</label><div id="needsBox"></div></div>' +
          '<div class="field"><label>Method</label><textarea id="f_method" rows="3" placeholder="Stir / shake / build instructions…">' + escapeHtml(c.method || "") + '</textarea></div>' +
          '<div class="field"><label>Notes</label><textarea id="f_notes" rows="3" placeholder="Tips, variations, adjustments…">' + escapeHtml(c.notes || "") + '</textarea></div>' +
          '<div class="field"><label>Name Story</label><textarea id="f_nameStory" rows="2" placeholder="Meaning behind the name, who it' + "'" + 's for, etc.">' + escapeHtml(c.nameStory || "") + '</textarea></div>' +
          '<div class="field"><label>Source</label><input type="text" id="f_source" value="' + escapeHtml(c.source || "") + '" placeholder="e.g. Whisky Advocate, personal recipe"></div>' +
          '<div class="modal-actions"><div class="left"></div><button class="primary" id="saveBtn">Save</button></div>' +
        '</div>' +
      '</div>';
    modalRoot.innerHTML = html;

    document.getElementById("closeBtn").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeModal(); });

    function bindIngredientButtons() {
      var list = document.getElementById("ingredientsList");
      Array.prototype.forEach.call(list.querySelectorAll(".removeIngBtn"), function(btn) {
        btn.onclick = function() {
          var row = btn.closest(".ingredient-row");
          if (list.querySelectorAll(".ingredient-row").length > 1) row.remove();
          else row.querySelector(".ingredient-input").value = "";
        };
      });
    }
    bindIngredientButtons();
    document.getElementById("addIngBtn").addEventListener("click", function() {
      var list = document.getElementById("ingredientsList");
      var div = document.createElement("div");
      div.className = "ingredient-row";
      div.innerHTML = '<input type="text" class="ingredient-input" placeholder="e.g. ¼ oz lemon juice"><button class="ghost removeIngBtn" type="button">✕</button>';
      list.appendChild(div);
      bindIngredientButtons();
      div.querySelector("input").focus();
    });

    function currentIngredientLines() {
      return Array.prototype.map.call(document.querySelectorAll("#ingredientsList .ingredient-input"), function(inp) { return inp.value.trim(); }).filter(Boolean);
    }
    var picker = setupNeedsPicker(c, !isNew, currentIngredientLines);

    document.getElementById("saveBtn").addEventListener("click", function() {
      var name = document.getElementById("f_name").value.trim();
      if (!name) { alert("Please give the cocktail a name."); return; }
      var ingredientInputs = document.querySelectorAll("#ingredientsList .ingredient-input");
      var ingredientsOut = Array.prototype.map.call(ingredientInputs, function(inp) { return inp.value.trim(); }).filter(function(v) { return v.length > 0; });
      var data = {
        name: name,
        category: document.getElementById("f_category").value,
        status: document.getElementById("f_status").value,
        spirit: document.getElementById("f_spirit").value.trim(),
        ingredients: ingredientsOut,
        method: document.getElementById("f_method").value.trim(),
        notes: document.getElementById("f_notes").value.trim(),
        nameStory: document.getElementById("f_nameStory").value.trim(),
        source: document.getElementById("f_source").value.trim()
      };
      if (picker.active) {
        var known = getItemMap();
        var chosen = (isNew && !picker.state.touched) ? suggestFromLines(ingredientsOut).ids : picker.state.needs;
        data.needs = chosen.filter(function(id, i) { return known[id] && chosen.indexOf(id) === i; });
      } else if (Array.isArray(c.needs)) {
        data.needs = c.needs.slice();
      }
      if (isNew) {
        data.id = slugify(data.name);
        data.tastingEntries = [];
        cocktails.push(data);
      } else {
        data.id = c.id;
        data.tastingEntries = c.tastingEntries || [];
        var idx = cocktails.findIndex(function(x) { return x.id === c.id; });
        if (idx >= 0) cocktails[idx] = data;
      }
      closeModal();
      render();
      pushToGitHub();
    });
  }

  // ---------- Data operations ----------

  function deleteCocktail(id) {
    cocktails = cocktails.filter(function(c) { return c.id !== id; });
    render();
    pushToGitHub();
  }
  function addTastingNote(id, note, rating) {
    var idx = cocktails.findIndex(function(c) { return c.id === id; });
    if (idx < 0) return;
    var entry = { date: new Date().toISOString(), note: note, rating: rating || null };
    if (!cocktails[idx].tastingEntries) cocktails[idx].tastingEntries = [];
    cocktails[idx].tastingEntries.push(entry);
    render();
    pushToGitHub();
  }

  // ---------- GitHub settings modal ----------

  function openSettingsModal(forcedOpen) {
    var s = settings || { owner: "", repo: "", path: "cocktails.json", token: "" };
    var html = '' +
      '<div class="modal-overlay" id="overlay">' +
        '<div class="modal">' +
          (forcedOpen ? '' : '<div class="modal-close-row"><button class="ghost" id="closeBtn">✕ Close</button></div>') +
          '<h2>GitHub Settings</h2>' +
          '<div style="color:var(--text-dim);margin-bottom:14px;">Connect this device to your GitHub repo so your ledger syncs everywhere. This is entered once per device/browser.</div>' +
          '<div class="field"><label>GitHub Username</label><input type="text" id="s_owner" value="' + escapeHtml(s.owner) + '" placeholder="e.g. scottdavis"></div>' +
          '<div class="field"><label>Repository Name</label><input type="text" id="s_repo" value="' + escapeHtml(s.repo) + '" placeholder="e.g. speakeasy-ledger"></div>' +
          '<div class="field"><label>Data File Path</label><input type="text" id="s_path" value="' + escapeHtml(s.path) + '" placeholder="cocktails.json"><div class="hint">Leave as cocktails.json unless you have a reason to change it. Bar Stock is saved beside it as inventory.json.</div></div>' +
          '<div class="field"><label>Personal Access Token</label><input type="password" id="s_token" value="' + escapeHtml(s.token) + '" placeholder="ghp_… or github_pat_…"><div class="hint">Needs Contents: Read and write permission on this repo. Stored only in this browser.</div></div>' +
          '<div id="settingsError" class="error-box" style="display:none;"></div>' +
          '<div class="modal-actions"><div class="left"></div><button class="primary" id="saveSettingsBtn">Save &amp; Connect</button></div>' +
        '</div>' +
      '</div>';
    modalRoot.innerHTML = html;
    if (!forcedOpen) {
      document.getElementById("closeBtn").addEventListener("click", closeModal);
      document.getElementById("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeModal(); });
    }
    document.getElementById("saveSettingsBtn").addEventListener("click", function() {
      var owner = document.getElementById("s_owner").value.trim();
      var repo = document.getElementById("s_repo").value.trim();
      var path = document.getElementById("s_path").value.trim() || "cocktails.json";
      var token = document.getElementById("s_token").value.trim();
      var errEl = document.getElementById("settingsError");
      if (!owner || !repo || !token) {
        errEl.textContent = "Username, repository name, and token are all required.";
        errEl.style.display = "block";
        return;
      }
      settings = { owner: owner, repo: repo, path: path, token: token };
      saveSettings(settings);
      closeModal();
      refreshAll();
    });
  }

  // ---------- Init ----------

  INV_CATEGORIES.forEach(function(c) {
    var opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    stockCategory.appendChild(opt);
  });

  searchInput.addEventListener("input", function() { currentFilter.search = searchInput.value; render(); });
  categoryFilter.addEventListener("change", function() { currentFilter.category = categoryFilter.value; render(); });
  statusFilter.addEventListener("change", function() { currentFilter.status = statusFilter.value; render(); });
  availFilter.addEventListener("change", function() { currentFilter.avail = availFilter.value; render(); });
  addBtn.addEventListener("click", function() { openEditModal(null); });
  syncBtn.addEventListener("click", refreshAll);
  settingsBtn.addEventListener("click", function() { openSettingsModal(false); });

  stockSearch.addEventListener("input", function() { stockFilter.search = stockSearch.value; render(); });
  stockCategory.addEventListener("change", function() { stockFilter.category = stockCategory.value; render(); });
  stockShow.addEventListener("change", function() { stockFilter.show = stockShow.value; render(); });
  document.getElementById("addItemBtn").addEventListener("click", function() { openItemModal(null); });
  document.getElementById("shopBtn").addEventListener("click", openShoppingModal);
  document.getElementById("syncBtn2").addEventListener("click", refreshAll);
  document.getElementById("settingsBtn2").addEventListener("click", function() { openSettingsModal(false); });

  tabCocktails.addEventListener("click", function() { setView("cocktails", true); });
  tabStock.addEventListener("click", function() { setView("stock", true); });
  window.addEventListener("hashchange", function() {
    var want = (location.hash === "#stock") ? "stock" : "cocktails";
    if (want !== currentView) setView(want, true);
  });

  mainEl.addEventListener("click", function(e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el || !mainEl.contains(el)) return;
    var act = el.getAttribute("data-act");
    if (act === "setstatus") setItemStatus(el.getAttribute("data-id"), el.getAttribute("data-st"));
    else if (act === "edititem") { var it = getItemMap()[el.getAttribute("data-id")]; if (it) openItemModal(it); }
    else if (act === "markgroup") markGroupIn(el.getAttribute("data-cat"));
    else if (act === "gostock") setView("stock", true);
    else if (act === "autolink") autoLinkAll();
  });

  var startView = (location.hash === "#stock") ? "stock" : "cocktails";
  settings = loadSettings();
  if (!settings) {
    var cached = loadLocalCache();
    if (cached) { cocktails = cached.cocktails; currentSha = cached.sha; }
    else { cocktails = SEED_DATA.slice(); }
    var invCached = loadInventoryCache();
    if (invCached) { inventory = invCached.items.map(normalizeItem); invChanged(); invSha = invCached.sha; invReady = true; }
    setView(startView);
    openSettingsModal(true);
  } else {
    isSyncing = true; invSyncing = true;
    setView(startView);
    fetchFromGitHub();
    fetchInventory();
  }
})();
</script>
</body>
</html>
